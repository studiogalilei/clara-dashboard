# Il direttore: ogni quarto d'ora (e subito, quando Smartlead bussa), in cloud, fa partire
# le operazioni dovute alla cadenza scelta da Dre nella Dashboard. Non sul suo Mac. (7/9/2026)
#
# 16/9: da ogni ora a ogni quarto d'ora. Dre vuole il Workspace vivo, e un'ora
# di ritardo non e' vivo. Piu' stretto di cosi' non conviene: ogni giro costa
# un minuto e mezzo di runner, e sotto il quarto d'ora la bolletta di GitHub
# cresce piu' in fretta di quanto migliori la vita. Le cose che devono
# arrivare SUBITO passano dai campanelli (webhook), non dall'orologio.
# 17/9: campanello anche per Gmail (funzione sveglia + scripts/orecchio.py):
# una mail fa partire il direttore entro un minuto, e gli inviti del
# calendario arrivano per mail. L'orologio passa a ogni venti minuti: e'
# la rete di sicurezza, non piu' la strada principale.
name: direttore

on:
  schedule:
    - cron: "*/20 * * * *"   # ogni venti minuti; mail e risposte arrivano dai campanelli (17/9)
  workflow_dispatch:
    inputs:
      forza:
        description: "Fai partire adesso un'operazione (chiave), vuoto = quelle dovute"
        required: false
        default: ""

concurrency:
  group: direttore           # mai due direttori insieme: il sync non va doppiato
  cancel-in-progress: false

jobs:
  direttore:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pywebpush
      - name: le operazioni dovute
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          WEBHOOK_SEGRETO: ${{ secrets.WEBHOOK_SEGRETO }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          CALENDARIO_ICS: ${{ secrets.CALENDARIO_ICS }}
          GRANOLA_API_KEY: ${{ secrets.GRANOLA_API_KEY }}
          # il playbook outbound non sta nel repo (22/9): arriva da qui
          PLAYBOOK_OUTBOUND: ${{ secrets.PLAYBOOK_OUTBOUND }}
          FORNITORE: openai
          MODELLO_OPENAI: gpt-5
        run: |
          if [ -n "${{ github.event.inputs.forza }}" ]; then
            python3 scripts/direttore.py --forza "${{ github.event.inputs.forza }}"
          else
            python3 scripts/direttore.py
          fi
