# Il cancello automatico: a ogni push GitHub rifà i controlli da solo.
# Serve a una cosa sola: che non finisca online una versione che non compila
# o che ha una regola di casa rotta. Non deve fare altro (7/9/2026).
name: controlla

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: compilatore, lint e prove
        run: npm run controlla
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # gli invarianti di Clara (24/9, da Galileo): se uno cade, il push non passa.
      # 12/10: dal 9/10 cadevano all'avvio per un segreto mancante (SMARTLEAD_API_KEY) e
      # nessuno se n'era accorto: un cancello rosso da tre giorni non ferma niente. Gli
      # invarianti leggono dati veri (bucket, database), quindi hanno gli stessi segreti del direttore.
      - name: gli invarianti di Clara
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TZ: Europe/Rome
        run: python3 scripts/test_invarianti.py
      - name: build vera
        run: npm run build
