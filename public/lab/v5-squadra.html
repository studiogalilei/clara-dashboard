<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V5, la squadra: Workspace di Studio Galilei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1C2E6E;--blu:#2979C4;--avorio:#FAF8F4;
  --ink:#121729;--testo:#2A2F45;--tenue:#5C6277;--spento:#868B9C;
  --bordo:#E6E1D7;--velo:#F3F0E9;--bianco:#fff;
  --ambra:#9A4A08;--ambra-bg:#FCEFD8;--ambra-dot:#E08A1E;
  --bluS:#1E5F9F;--blu-bg:#E6F0FA;--blu-dot:#2979C4;
  --verde:#166B37;--verde-bg:#E1F3E6;--verde-dot:#22A05A;
  --rosso:#AD2117;--rosso-bg:#FCE7E5;--rosso-dot:#E0453A;
  --neutro:#4D5368;--neutro-bg:#EFEDE7;
  --top:34px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:var(--avorio);color:var(--testo);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.senza-striscia{--top:0px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;color:var(--navy)}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* striscia */
#striscia{height:var(--top);background:var(--navy);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 44px;position:relative;letter-spacing:.01em}
body.senza-striscia #striscia{display:none}
#striscia button{position:absolute;right:4px;top:0;height:var(--top);width:40px;display:grid;place-items:center;color:#fff;opacity:.8}
#striscia button:hover{opacity:1}

/* impalcatura */
#app{display:grid;grid-template-columns:216px minmax(0,1fr) 320px;height:calc(100dvh - var(--top))}
#app.senza-clara{grid-template-columns:216px minmax(0,1fr)}
#app.senza-clara .clara-p{display:none}
.side{background:#fff;border-right:1px solid var(--bordo);display:flex;flex-direction:column;overflow-y:auto;padding:18px 14px 14px}
.main{overflow-y:auto;min-width:0;position:relative;container-type:inline-size}
.main-in{padding:24px 32px 72px;max-width:1240px}
@container (max-width:820px){.riga .da .nm{display:none}}
.clara-p{background:#fff;border-left:1px solid var(--bordo);display:flex;flex-direction:column;min-height:0;position:relative}
.topbar,.tabbar,.pollice,.fab-clara{display:none}

/* lato */
.marchio{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.marchio-m{width:30px;height:30px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.02em}
.marchio b{display:block;color:var(--navy);font-size:14px;font-weight:800;line-height:1.1}
.marchio span{font-size:11.5px;color:var(--tenue)}
.eti{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--spento)}
.vedi{padding:0 4px 14px;border-bottom:1px solid var(--bordo);margin-bottom:12px}
.vedi .eti{padding:0 4px 8px;display:block}
.vedi-g{display:flex;flex-direction:column;gap:2px}
.vedi-b{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:10px;min-height:38px;position:relative;text-align:left;font-weight:600;font-size:13px;color:var(--testo)}
.vedi-b:hover{background:var(--velo)}
.vedi-b.on{background:var(--navy);color:#fff}
.vedi-b .bdg{margin-left:auto}
.vedi-b.on .bdg{background:#fff;color:var(--navy)}
.nav a,.nav button{display:flex;align-items:center;gap:11px;padding:0 10px;height:40px;border-radius:10px;color:var(--testo);text-decoration:none;font-weight:600;width:100%;font-size:14px}
.nav a:hover{background:var(--velo)}
.nav a.on{background:var(--blu-bg);color:var(--navy)}
.nav a .bdg{margin-left:auto}
.nav svg{width:19px;height:19px;flex:none;color:var(--blu)}
.side-piede{margin-top:auto;padding:14px 8px 0;font-size:12px;color:var(--tenue);border-top:1px solid var(--bordo)}
.side-piede b{color:var(--navy);display:block;font-size:13px}
.bdg{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ambra-bg);color:var(--ambra);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.bdg.rosso{background:var(--rosso-bg);color:var(--rosso)}

/* avatar */
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;flex:none;line-height:1}
.av.clara{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy);position:relative}
.av.clara::after{content:"";position:absolute;right:-1px;bottom:-1px;width:30%;height:30%;border-radius:50%;background:var(--blu);box-shadow:0 0 0 2px #fff}

/* testata pagina */
.testa{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.testa .k{font-size:13px;color:var(--tenue);font-weight:600;margin-bottom:2px}
.titolo{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.torna{display:inline-flex;align-items:center;gap:6px;color:var(--blu);font-weight:700;font-size:13px;min-height:32px;margin-bottom:6px}
.torna:hover{text-decoration:underline}

/* pillole e stati */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--neutro-bg);color:var(--neutro)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.pill.nodot::before{display:none}
.ambra{--c:var(--ambra);--bg:var(--ambra-bg);--dot:var(--ambra-dot)}
.blu{--c:var(--bluS);--bg:var(--blu-bg);--dot:var(--blu-dot)}
.verde{--c:var(--verde);--bg:var(--verde-bg);--dot:var(--verde-dot)}
.rosso{--c:var(--rosso);--bg:var(--rosso-bg);--dot:var(--rosso-dot)}
.neutro{--c:var(--neutro);--bg:var(--neutro-bg);--dot:#9AA0B0}
.pill.ambra,.pill.blu,.pill.verde,.pill.rosso,.pill.neutro{background:var(--bg);color:var(--c)}
.pill.ambra::before,.pill.blu::before,.pill.verde::before,.pill.rosso::before,.pill.neutro::before{background:var(--dot)}

/* bottoni */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-weight:700;font-size:14px;border:1px solid var(--bordo);background:#fff;color:var(--navy);white-space:nowrap;transition:background-color .12s ease-out,border-color .12s ease-out,transform .08s ease-out}
.btn:hover{background:var(--velo)}
.btn:active{transform:scale(.98)}
.btn.pieno{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pieno:hover{background:#15235A}
.btn.verdeb{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.vuoto{border-color:transparent;background:transparent;color:var(--blu)}
.btn.vuoto:hover{background:var(--blu-bg)}
.btn.piccolo{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:17px;height:17px}
.azioni{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* carte */
.card{background:#fff;border:1px solid var(--bordo);border-radius:16px}
.card-p{padding:18px 20px}
.card h3{font-size:15px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
.card h3 .n{color:var(--spento);font-weight:600}
.sez{margin-top:26px}
.sez-t{display:flex;align-items:center;gap:10px;margin:0 2px 10px}
.sez-t h2{font-size:17px;font-weight:800}
.sez-t .n{color:var(--spento);font-weight:700;font-size:15px}
.sez-t .dx{margin-left:auto}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}
.home .col-b{display:flex;flex-direction:column;gap:14px}
.hero{background:#fff;border:1px solid var(--bordo);border-radius:18px;padding:22px 24px 22px}
.hero-k{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hero h1{font-size:24px;font-weight:800;letter-spacing:-.015em;line-height:1.2;max-width:34ch}
.hero p{color:var(--tenue);margin-top:6px;font-size:15px;max-width:60ch}
.hero .azioni{margin-top:18px}
.hero .da{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--tenue);font-weight:600;margin-left:6px}

/* liste */
.lista{background:#fff;border:1px solid var(--bordo);border-radius:16px;overflow:hidden}
.riga{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 16px;text-align:left;border-bottom:1px solid var(--bordo);background:#fff;transition:background-color .12s ease-out}
.riga:last-child{border-bottom:0}
button.riga:hover,a.riga:hover{background:#FCFBF8}
.riga .st{width:9px;height:9px;border-radius:50%;background:var(--dot);flex:none}
.riga-c{flex:1;min-width:0;display:flex;flex-direction:column}
.riga-t{font-weight:700;color:var(--ink);font-size:14.5px;line-height:1.3}
.riga-s{color:var(--tenue);font-size:13px;line-height:1.4;margin-top:2px}
.riga .da{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tenue);font-weight:600;flex:none}
.riga .fr{color:var(--spento);flex:none;width:16px;height:16px}
.vuoto-r{padding:16px;color:var(--tenue);font-size:14px}
.mini{font-size:12.5px;color:var(--tenue)}
.mini b{color:var(--testo)}

/* lato destro home */
.call-c .q{font-size:13px;color:var(--tenue);font-weight:600}
.call-c .n{font-size:18px;font-weight:800;color:var(--navy);margin:2px 0 2px}
.passato{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--bordo);align-items:flex-start}
.passato:first-of-type{border-top:0}
.passato .t{font-weight:700;font-size:13.5px;color:var(--ink);line-height:1.3}
.passato .s{font-size:12.5px;color:var(--tenue);margin-top:3px}
.passato .pill{margin-top:6px}
.giornata{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--velo);font-size:13px;color:var(--tenue)}
.giornata b{color:var(--ink)}
.giornata .ok{color:var(--verde);font-weight:700}
.giornata .no{color:var(--ambra);font-weight:700}

/* numeri lorenzo */
.numeri{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.numero{background:#fff;border:1px solid var(--bordo);border-radius:14px;padding:12px 14px}
.numero b{display:block;font-size:24px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.numero span{font-size:12.5px;color:var(--tenue);font-weight:600}

/* posta */
.posta{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
.tabs{display:flex;gap:4px;padding:4px;background:var(--velo);border-radius:12px;margin-bottom:12px}
.tabs button{flex:1;height:36px;border-radius:9px;font-weight:700;font-size:13px;color:var(--tenue);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(18,23,41,.08)}
.riga.sel{background:var(--blu-bg)}
.pane{background:#fff;border:1px solid var(--bordo);border-radius:18px;padding:22px 24px}
.pane-t{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pane-t h2{font-size:21px;font-weight:800}
.pane-t .s{color:var(--tenue);font-size:13.5px;margin-top:2px}
.filo{margin:18px 0 6px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5}
.msg .q{display:block;font-size:11.5px;color:var(--spento);font-weight:600;margin-bottom:3px}
.msg.noi{align-self:flex-end;background:var(--blu-bg);color:var(--ink);border-bottom-right-radius:4px}
.msg.loro{align-self:flex-start;background:var(--velo);color:var(--ink);border-bottom-left-radius:4px}
.bozza-t{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.bozza-t b{color:var(--navy);font-size:14px}
.nota-clara{display:flex;gap:10px;align-items:flex-start;background:var(--velo);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--testo);margin-bottom:10px}
textarea.campo,input.campo{width:100%;border:1px solid var(--bordo);border-radius:12px;padding:12px 14px;background:#fff;line-height:1.55;font-size:14.5px;resize:vertical;color:var(--ink)}
textarea.campo{field-sizing:content;min-height:96px}
textarea.campo:focus,input.campo:focus{outline:2px solid var(--blu);outline-offset:-1px;border-color:transparent}
.fatto-b{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--verde-bg);color:var(--verde);font-weight:700;margin-top:14px}
.fila-n{font-size:12.5px;font-weight:700;color:var(--tenue)}

/* trattativa */
.colonne{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.colonna{background:var(--velo);border-radius:16px;padding:10px}
.colonna-t{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:800;color:var(--navy);font-size:14px}
.colonna-t .n{color:var(--spento);font-weight:700}
.tess{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--bordo);border-radius:13px;padding:12px 13px;margin-bottom:8px;transition:border-color .12s ease-out}
.tess:hover{border-color:#CFC8BA}
.tess .n{font-weight:800;color:var(--ink);font-size:14px;line-height:1.3;display:flex;gap:6px;align-items:flex-start}
.tess .c{font-size:12.5px;color:var(--tenue)}
.tess .m{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12.5px;color:var(--testo);font-weight:600;line-height:1.3}
.tess .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tess .pill,.passato .pill{white-space:normal;height:auto;min-height:24px;padding:3px 10px;line-height:1.3}
.tri{color:#C98A00;flex:none;width:16px;height:16px;margin-top:1px}

/* scheda */
.detto{background:var(--navy);color:#fff;border-radius:18px;padding:20px 22px}
.detto .eti{color:#AFC0EC}
.detto ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.detto li{font-size:16px;font-weight:600;line-height:1.45}
.detto li small{display:block;font-size:12px;font-weight:500;color:#B9C6EA;margin-top:2px}
.scheda{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:20px;align-items:start}
.blocco{background:#fff;border:1px solid var(--bordo);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.blocco h3{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--spento);margin-bottom:8px}
.blocco p{font-size:15px;color:var(--ink)}
.mercato{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mercato div{background:var(--velo);border-radius:12px;padding:10px 12px}
.mercato b{display:block;font-size:19px;font-weight:800;color:var(--navy)}
.mercato span{font-size:12px;color:var(--tenue);font-weight:600}
.scomode{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.scomode li{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink);font-weight:600}
.scomode li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ambra-dot);margin-top:8px;flex:none}
.catena{list-style:none;margin:0;padding:0}
.catena li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;position:relative}
.catena li:not(:last-child)::after{content:"";position:absolute;left:11px;top:31px;bottom:-5px;width:2px;background:var(--bordo)}
.catena .t{font-size:13.5px;color:var(--ink);font-weight:600;line-height:1.3}
.catena .q{font-size:12px;color:var(--tenue)}
.gia{margin:0;padding-left:18px;color:var(--testo);font-size:13.5px}
.gia li{margin:3px 0}

/* accessi */
.acc{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bordo);flex-wrap:wrap}
.acc:first-child{border-top:0}
.acc .c{flex:1;min-width:150px}
.acc .t{font-weight:700;color:var(--ink);font-size:14px}
.acc .s{font-size:12.5px;color:var(--tenue)}
.acc .chi{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tenue);font-weight:600}

/* passaggio */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.step{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:20px;background:#fff;border:1px solid var(--bordo);font-size:12.5px;font-weight:700;color:var(--tenue)}
.step .o{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--velo);color:var(--tenue);font-size:11px}
.step.ok{color:var(--verde)}
.step.ok .o{background:var(--verde-bg);color:var(--verde)}
.step.ora{color:var(--ambra);border-color:#F1D3A6}
.step.ora .o{background:var(--ambra-bg);color:var(--ambra)}
.campo5{background:#fff;border:1px solid var(--bordo);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.campo5.manca{border-color:#EBC27F;background:#FFFCF6}
.campo5-t{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.campo5-t .i{width:24px;height:24px;border-radius:7px;background:var(--navy);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.campo5-t b{color:var(--navy);font-size:15px}
.campo5-t .fonte{margin-left:auto;font-size:12px;color:var(--tenue);font-weight:600}
.campo5 p{font-size:15px;color:var(--ink)}
.campo5 textarea.campo{min-height:64px}
.pass-g{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.pass-dx{position:sticky;top:12px}
@container (max-width:760px){.pass-g{grid-template-columns:minmax(0,1fr)}.pass-dx{position:static}}
.domande{background:var(--blu-bg);border-radius:16px;padding:18px}
.domande .btn{white-space:normal;height:auto;min-height:40px;padding:8px 14px;text-align:center}
.domande h3{font-size:16px;margin-bottom:4px}
.domande label{display:block;font-weight:700;color:var(--navy);font-size:14px;margin:12px 0 6px}
.risposta{background:var(--velo);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:6px}
.risposta b{color:var(--navy)}
.aspettarsi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.aspettarsi div{background:var(--velo);border-radius:12px;padding:10px 12px;font-size:13px}
.aspettarsi b{display:block;color:var(--navy);font-size:13px}

/* report */
.report-r{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--bordo);align-items:start}
.report-r:first-child{border-top:0}
.report-r b{color:var(--navy);font-size:14px;padding-top:12px}
.report-r textarea.campo{min-height:52px}
.firma{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--bordo)}

/* tabella giacomo */
.filtri{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--bordo);background:#fff;font-weight:700;font-size:13px;color:var(--testo);display:inline-flex;align-items:center;gap:7px}
.chip .n{color:var(--spento);font-variant-numeric:tabular-nums}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

  const tc = {risposta:'ambra',analisi:'blu',follow_up:'ambra',conoscitiva:'blu',tecnica:'blu',avvio:'blu',prova:'ambra',cliente:'verde'};

      <td>${r.mossa ? `<span class="chi-c" style="white-space:normal">${r.mossa.chi!==r.chi?av(r.mossa.chi,18):''}${esc(r.mossa.cosa)}</span>` : `<span class="chi-c ambratxt">${ic('tri','tri')} senza mossa</span>`}</td>
      <td class="${r.mossa && gg(r.mossa.quando)<0?'rossotxt':''}">${r.mossa?quando(r.mossa.quando):'-'}</td>
      <td class="${r.fermo?'rossotxt':''}">${r.fermo ? 'fermo da '+r.fermo+' g' : quando(r.ultima)}</td>
      <td>${r.b ? `<span class="${r.b.rosso?'rossotxt':''}">${r.b.chi?nome(r.b.chi)+': ':''}${esc(r.b.t)}</span>` : '<span class="sm">-</span>'}</td>
      <td class="r">${euro(r.valore)}</td></tr>`).join('')}
    </tbody></table>${piedeSoldi()}</div>`;
  const mob = `<div class="righe-m"><div class="lista">${rows.map(r=>`<button class="riga ${r.b&&r.b.rosso||r.fermo?'rosso':!r.mossa?'ambra':'neutro'}" data-a="go" data-x="scheda/${r.id}"><span class="st"></span><span class="riga-c"><span class="riga-t">${esc(r.nome)}</span><span class="riga-s">${TAPPA[r.tappa]}, ${nome(r.chi)}. ${r.mossa?esc(r.mossa.cosa)+', '+quando(r.mossa.quando):'Senza mossa'}${r.b?'. Bloccato da '+(r.b.chi?nome(r.b.chi)+': ':'')+esc(r.b.t):''}</span></span>${ic('freccia','fr')}</button>`).join('')}</div>${piedeSoldi(true)}</div>`;
  const ch = (k,t) => `<button class="chip ${S.filtroG===k?'on':''}" data-a="filtroG" data-x="${k}">${t} <span class="n">${n[k]}</span></button>`;
  const dx = `<div class="azioni solo-desk"><button class="btn piccolo" data-a="esporta">${ic('scarica')} Esporta per Excel</button></div>`;
  return testa(dataTesta(),'Tabella',dx)
    + (c.length ? `<div class="sez" style="margin-top:0;margin-bottom:22px"><div class="sez-t"><h2>Da guardare</h2><span class="n">${c.length}</span></div><div class="lista">${c.map(riga).join('')}</div></div>` : '')
    + `<div class="filtri">${ch('tutte','Tutte')}${ch('ferme','Ferme')}${ch('senza','Senza mossa')}${ch('clienti','Clienti')}</div>` + tabella + mob
    + `<div class="sez"><div class="sez-t"><h2>Accessi</h2></div><div class="tab-wrap"><table class="densa"><thead><tr><th>Cliente</th><th>Accesso</th><th>Stato</th><th>Chi insegue</th></tr></thead><tbody>${['a7','a8'].flatMap(az=>S.accessi[az].filter(r=>r.stato!=='ok').map(r=>{const g=-gg(r.dal);return `<tr data-a="go" data-x="scheda/${az}"><td class="tn">${AZ[az].nome}</td><td>${esc(r.cosa)}</td><td class="${g>3?'rossotxt':''}">${r.stato==='sbagliato'?'sbagliato, ':'chiesto, '}${g>3?'fermo da '+g+' g':quando(r.dal)}</td><td><span class="chi-c">${av(r.chi,20)} ${nome(r.chi)}</span></td></tr>`;})).join('') || '<tr><td colspan="4" class="sm">Tutti gli accessi sono a posto.</td></tr>'}</tbody></table></div></div>`;
}

/* La Posta di Dre */
V.posta = () => {
  const conv = Object.values(S.conv);
  const fila = S.fila.filter(x=>!x.fatto);
  let arg = S.arg;
  if(!arg){ const f0 = conv.find(c=>!c.fatto); if(f0) arg = f0.id; }
  const tab = !arg ? 'conv' : arg==='fila' ? 'fila' : arg==='corsa' ? 'corsa' : 'conv';
  const aperte = conv.filter(c=>!c.fatto);
  const lista = tab==='conv' ? (conv.map(c => { const a = AZ[c.azienda];
        return `<button class="riga ${c.fatto?'verde':c.ore>2?'rosso':'ambra'} ${arg===c.id?'sel':''}" data-a="go" data-x="posta/${c.id}"><span class="st"></span><span class="riga-c"><span class="riga-t">${a.nome}</span><span class="riga-s">${c.fatto?'Fatto alle '+c.fattoIl:esc(c.perche)}</span></span><span class="pill ${c.fatto?'verde':c.ore>2?'rosso':'ambra'}">${c.fatto?'fatto':c.aspetta}</span></button>`; }).join(''))
    : tab==='fila' ? (fila.map((f,i) => `<button class="riga ambra ${i===0?'sel':''}" data-a="go" data-x="posta/fila"><span class="st"></span><span class="riga-c"><span class="riga-t">${esc(f.nome)}</span><span class="riga-s">${esc(f.perche)}</span></span>${f.da!=='clara'?`<span class="da">${av(f.da,20)}</span>`:''}</button>`).join('') || '<div class="vuoto-r">La fila è vuota. Tutti i follow-up dovuti sono partiti.</div>')
    : corsaRighe();
  const tabs = `<div class="tabs" role="tablist"><button class="${tab==='conv'?'on':''}" data-a="go" data-x="posta">Per te <span class="bdg ${aperte.some(c=>c.ore>2)?'rosso':''}">${aperte.length}</span></button><button class="${tab==='fila'?'on':''}" data-a="go" data-x="posta/fila">La fila <span class="bdg">${fila.length}</span></button><button class="${tab==='corsa'?'on':''}" data-a="go" data-x="posta/corsa">In corsa</button></div>`;
  let pane = '';
  if(tab==='conv'){ const c = S.conv[arg] || aperte[0] || conv[0]; if(!arg && c) arg = c.id; pane = paneConv(c); }
  if(tab==='fila') pane = paneFila(fila);
  if(!S.arg){ const c0 = aperte[0]; pollice(c0 ? {l:'Apri '+AZ[c0.azienda].nome, a:'go', x:'posta/'+c0.id} : fila.length ? {l:'Apri la fila', a:'go', x:'posta/fila'} : null); }
  if(tab==='corsa') { pane = `<div class="pane"><div class="pane-t"><div><h2>In corsa da sole</h2><div class="s">Non serve niente da te. Se una si ferma, te lo dico.</div></div></div><div class="lista" style="margin-top:14px">${corsaRighe()}</div></div>`; pollice(null); }
  const dett = !!S.arg;
  return `<div class="${dett?'solo-desk':''}">${testa(dataTesta(),'Posta')}</div>${dett?`<button class="torna solo-tel" data-a="go" data-x="posta" style="margin-bottom:8px">${ic('indietro')} Posta</button>`:''}
    <div class="posta ${dett && tab!=='corsa' ?'con-dettaglio':''}"><div class="posta-lista">${tabs}<div class="lista">${lista}</div></div><div class="posta-pane">${pane}</div></div>`;
};
function corsaRighe(){
  const pc = S.passaggi.filter(x=>x.tipo==='cliente' && x.stato==='da accettare');
  return [
    ['blu','Agriturismo Colle Verde','Analisi partita da sola il 4/10. L’ha aperta 2 volte.','scheda/a4'],
    ['blu','6 risposte oggi','Clara le ha smistate: 4 sì con l’analisi già partita, 1 «non ora», 1 da te.','posta'],
    ['blu','38 follow-up in sequenza','Su Smartlead, nessuno ha risposto: si spengono da soli alla prima risposta.','posta/corsa'],
    ...pc.map(x=>['ambra',x.titolo,'Passato a '+nome(x.a)+' '+x.mandato+': non l’ha ancora accettato.','passaggio/'+x.id])
  ].map(r=>`<button class="riga ${r[0]}" data-a="go" data-x="${r[3]}"><span class="st"></span><span class="riga-c"><span class="riga-t">${esc(r[1])}</span><span class="riga-s">${esc(r[2])}</span></span><span class="pill ${r[0]} solo-desk">${r[0]==='blu'?'corre da solo':'aspetta '+nome('carlo')}</span></button>`).join('');
}
function paneConv(c){
  if(!c){ pollice(null); return `<div class="pane"><h2>Nessuna conversazione aspetta te.</h2></div>`; }
  const a = AZ[c.azienda];
  if(c.fatto){ const nx = Object.values(S.conv).find(x=>!x.fatto); pollice(nx?{l:'Prossima: '+AZ[nx.azienda].nome,a:'go',x:'posta/'+nx.id}:(S.fila.some(f=>!f.fatto)?{l:'Apri la fila',a:'go',x:'posta/fila'}:null));
    return `<div class="pane"><div class="pane-t"><div><h2>${a.nome}</h2><div class="s">${a.persona}</div></div></div><div class="fatto-b">${ic('spunta')} Fatto alle ${c.fattoIl}. ${c.esito?esc(c.esito):''}</div>${nx?`<button class="btn pieno solo-desk" style="margin-top:14px" data-a="go" data-x="posta/${nx.id}">Prossima: ${AZ[nx.azienda].nome}</button>`:''}</div>`; }
  pollice(c.bozza ? {l:'Fatto, l’ho mandata', a:'convFatta', x:c.id} : {l:'L’ho chiamato', a:'chiamato', x:c.id});
  return `<div class="pane"><div class="pane-t"><div><h2>${a.nome}</h2><div class="s">${a.persona}, ${a.citta}. ${TAPPA[a.tappa]}</div></div><span class="pill ${c.ore>2?'rosso':'ambra'}">aspetta ${c.aspetta}</span></div>
    <div class="filo">${c.filo.map(m=>`<div class="msg ${m.chi}"><span class="q">${m.chi==='noi'?'Noi':a.persona.split(' ')[0]}, ${m.quando}</span>${esc(m.testo)}</div>`).join('')}</div>
    ${c.bozza ? `<div class="bozza-t">${av('clara',24)}<b>Bozza di Clara</b></div><div class="nota-clara">${esc(c.nota)}</div><textarea class="campo" data-bind="conv.${c.id}.bozza" aria-label="Bozza della risposta" style="min-height:240px">${esc(c.bozza)}</textarea>
      <div class="azioni" style="margin-top:12px"><button class="btn" data-a="copia" data-x="conv:${c.id}">${ic('copia')} Copia per Smartlead</button><button class="btn pieno solo-desk" data-a="convFatta" data-x="${c.id}">${ic('spunta')} Fatto, l’ho mandata</button><button class="btn vuoto" data-a="nonOraFoglio" data-x="conv:${c.id}">Non ora</button></div>`
      : `<div class="nota-clara" style="margin-top:14px">${av('clara',22)}<span>${esc(c.nota)}</span></div><div class="azioni"><a class="btn" href="tel:3470000000">Chiama</a><button class="btn pieno solo-desk" data-a="chiamato" data-x="${c.id}">${ic('spunta')} L’ho chiamato</button><button class="btn vuoto" data-a="nonOraFoglio" data-x="conv:${c.id}">Non ora</button></div>`}
  </div>`;
}
function paneFila(fila){
  const f = fila[0];
  if(!f){ pollice(null); return `<div class="pane"><div class="fatto-b">${ic('spunta')} La fila è vuota: tutti i follow-up dovuti sono partiti.</div></div>`; }

}

/* La scheda di un’azienda, anche per la call */

  else if(a.tappa==='avvio' && pc) az = {l:'Apri il passaggio', a:'go', x:'passaggio/'+pc.id};
  else if(a.id==='a8') az = S.allarme.a8 && S.io==='carlo' ? {l:'Controllato: era il tag', a:'allarmeOk', x:'a8'} : {l:'Report di settembre', a:'go', x:'report/a8'};
  else if(a.id==='a9') az = {l:'Report di settembre', a:'go', x:'report/a9'};
  else if(a.id==='a4' && !m) az = {l:'Dai una prossima mossa', a:'mossaClara', x:'a4'};
  else { const c = Object.values(S.conv).find(c=>c.azienda===a.id&&!c.fatto); const f = S.fila.find(x=>x.az===a.id&&!x.fatto); if(c) az={l:'Apri nella Posta',a:'go',x:'posta/'+c.id}; else if(f) az={l:'Apri la fila',a:'go',x:'posta/fila'}; }

    ${a.detto&&a.detto.length?`<section class="detto"><div class="eti">Cosa ci ha già detto</div><ul>${a.detto.map(d=>`<li>«${esc(d.t)}»<small>${esc(d.f)}</small></li>`).join('')}</ul></section>`:''}
    ${S.allarme[a.id]?`<div class="nota-clara" style="margin-top:14px;background:var(--rosso-bg);color:var(--rosso)">${ic('allerta')} <span><b>Allarme tracciamento.</b> Clic stabili, conversioni a zero da ieri: è il tag, non la campagna.</span></div>`:''}
    <div class="scheda"><div>
      <div class="blocco"><h3>Dove eravamo</h3><p>${esc(a.dove)}</p></div>

      ${a.scomode.length?`<div class="blocco"><h3>${a.scomode.length===2?'Le due cose scomode':'Le cose scomode'}</h3><ul class="scomode">${a.scomode.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}
      ${S.accessi[a.id]?`<div class="blocco" id="acc-${a.id}"><h3>Accessi, ${accTxt(a.id)}</h3>${listaAccessi(a.id,S.io)}</div>`:''}

  const edit = ioMando && (x.stato==='bozza');
  const manca = CAMPI.filter(c=>!x.campi[c[0]].trim());
  const st = [
    {t:'Clara l’ha preparata', ok:true},
    {t: x.stato==='bozza' ? nome(x.da)+' la completa' : nome(x.da)+' l’ha mandata '+(x.mandato||''), ok:x.stato!=='bozza', ora:x.stato==='bozza'},
    {t: x.stato==='accettato' ? nome(x.a)+' l’ha accettata '+(x.accettatoIl?'alle '+x.accettatoIl:'') : x.stato==='indietro' ? nome(x.a)+' ha una domanda' : nome(x.a)+' la accetta'+(x.scade?', entro '+x.scade.replace('oggi alle','le').replace('domani alle','domani alle'):''), ok:x.stato==='accettato', ora:x.stato==='da accettare'||x.stato==='indietro'}
  ];
  if(edit) pollice({l: manca.length ? 'Mancano '+manca.length+' campi' : 'Manda a '+nome(x.a), a:'mandaPass', x:x.id, dis:!!manca.length});
  else if(ioRicevo && x.stato==='da accettare') pollice({l:'Accetta, è mio', a:'accettaPass', x:x.id});
  else if(ioMando && x.stato==='indietro') pollice({l:'Rispondi e rimanda a '+nome(x.a), a:'rispondiPass', x:x.id});
  else pollice(null);
  const campi = CAMPI.map((c,i) => { const v = x.campi[c[0]]; const vuoto = !v.trim();
    return `<div class="campo5 ${edit&&vuoto?'manca':''}" data-campo="${c[0]}"><div class="campo5-t"><span class="i">${i+1}</span><b>${c[1]}</b>${edit&&vuoto?'<span class="pill ambra">manca: lo sai solo tu</span>':''}<span class="fonte">${x.fonti[c[0]]?av('clara',16)+' dalla '+esc(x.fonti[c[0]]):''}</span></div>
      ${edit ? `<textarea class="campo" data-bind="pass.${x.id}.campi.${c[0]}" aria-label="${c[1]}">${esc(v)}</textarea>` : `<p>${esc(v)}</p>`}</div>`; }).join('');
  const scambi = x.scambi.map(s=>`<div class="risposta"><b>${nome(s.chi)}:</b> ${esc(s.t)}</div>`).join('');
  let fondo = '';
  if(ioRicevo && x.stato==='da accettare') fondo = `<div class="domande"><h3>Prima di accettare, due domande</h3><p class="mini">Le risposte arrivano a ${nome(x.da)}. Finché non accetti, ${a.nome} resta di ${nome(x.da)}.</p>
      <label for="q1">Cosa ti manca?</label><textarea class="campo" id="q1" data-bind="pass.${x.id}.domande.manca" style="min-height:60px">${esc(x.domande.manca)}</textarea>
      <label for="q2">C’è qualcosa che non possiamo mantenere?</label><textarea class="campo" id="q2" data-bind="pass.${x.id}.domande.mantenere" style="min-height:60px">${esc(x.domande.mantenere)}</textarea>
      <div class="azioni" style="margin-top:14px"><button class="btn pieno solo-desk" data-a="accettaPass" data-x="${x.id}">${ic('spunta')} Accetta, è mio</button><button class="btn" data-a="indietroPass" data-x="${x.id}">Rimanda a ${nome(x.da)} con una domanda</button></div></div>`;
  else if(ioMando && x.stato==='indietro') fondo = `<div class="domande"><h3>${nome(x.a)} ti chiede</h3>${scambi}<label for="qr">La tua risposta</label><textarea class="campo" id="qr" data-bind="pass.${x.id}.risposta" style="min-height:60px">${esc(x.risposta||'')}</textarea><div class="azioni solo-desk" style="margin-top:12px"><button class="btn pieno" data-a="rispondiPass" data-x="${x.id}">Rispondi e rimanda a ${nome(x.a)}</button></div></div>`;
  else if(x.stato==='accettato') fondo = `<div class="fatto-b">${ic('spunta')} Accettato da ${nome(x.a)}${x.accettatoIl?' alle '+x.accettatoIl:''}. Adesso ${a.nome} è suo.</div>${x.domande.manca||x.domande.mantenere?`<div class="risposta" style="margin-top:10px">${x.domande.manca?`<b>Gli manca:</b> ${esc(x.domande.manca)}<br>`:''}${x.domande.mantenere?`<b>Da non promettere:</b> ${esc(x.domande.mantenere)}`:''}</div>`:''}`;
  else if(x.stato==='da accettare') fondo = `<div class="nota-clara">${av('clara',22)}<span>${nome(x.a)} non l’ha ancora accettato. Se ${x.scade?'entro '+x.scade.replace('oggi alle','le'):'entro 24 ore'} è ancora qui, avviso ${nome(x.da)} e Giacomo.</span></div>${scambi}`;

  const aspett = S.aspettarsi[x.az] ? `<div class="campo5"><div class="campo5-t"><span class="i" style="background:var(--blu)">+</span><b>Cosa aspettarsi nei 2 mesi</b><span class="fonte">approvato da Dre, mandato al cliente</span></div><div class="aspettarsi">${S.aspettarsi[x.az].map(z=>`<div><b>${z[0]}</b>${esc(z[1])}</div>`).join('')}</div></div>` : '';
  return `${tornaLink()}<div class="testa"><div><div class="k">Passaggio ${nome(x.da)} → ${nome(x.a)}</div><h1 class="titolo">${a.nome}</h1></div><div class="solo-desk" style="display:flex;align-items:center;gap:6px">${av(x.da,32)}<span style="color:var(--spento)">${ic('manda').replace('<svg','<svg style="width:18px;height:18px"')}</span>${av(x.a,32)}</div></div>
    <div class="stepper">${st.map((s,i)=>`<span class="step ${s.ok?'ok':s.ora?'ora':''}"><span class="o">${s.ok?'✓':i+1}</span>${esc(s.t)}</span>`).join('')}</div>
    ${a.detto?`<section class="detto" style="margin-bottom:14px"><div class="eti">Cosa ci ha già detto</div><ul>${a.detto.map(d=>`<li>«${esc(d.t)}»<small>${esc(d.f)}</small></li>`).join('')}</ul></section>`:''}
    <div class="pass-g"><div>${campi}${aspett}${S.accessi[x.az]?`<div class="campo5"><div class="campo5-t"><span class="i" style="background:var(--blu)">+</span><b>Lista accessi, ${accTxt(x.az)}</b></div>${listaAccessi(x.az,S.io)}</div>`:''}</div>

/* ---------- la chat ---------- */
function chatHTML(p, pannello){
  const msgs = S.chat[p] || [];
  const chips = ['Cosa mi manca oggi?','A che punto sono i passaggi?','Ricordamelo domani'];
  return `<div class="chat-testa">${av('clara',38)}<div><b>Clara</b><span class="on">in linea</span></div>${pannello?`<button class="clara-chiudi" data-a="chiudiClara" aria-label="Riduci Clara" title="Riduci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`:''}</div>
    <div class="chat-msg" data-chat>${'<div class="giorno">Oggi</div>'}${msgs.map((m,i)=> m.da==='io'
      ? `<div class="bolla mia">${esc(m.testo)}<span class="ora">${m.t}</span></div>`
      : `<div class="bolla sua">${m.testo}${m.bottoni&&!m.usato?`<div class="bolla-az">${m.bottoni.map((b,j)=>`<button class="btn ${j?'':'pieno'}" data-a="${b.a}" data-x="${esc(b.x||'')}" data-m="${i}" data-eco="${b.eco?1:''}" data-l="${esc(b.l)}">${esc(b.l)}</button>`).join('')}</div>`:''}<span class="ora">${m.t}</span></div>`).join('')}
      ${S.scrive===p?'<div class="bolla sua scrive" aria-label="Clara sta scrivendo"><span></span><span></span><span></span></div>':''}</div>
    <div class="chips-c">${chips.map(c=>`<button data-a="chiedi" data-x="${c}">${c}</button>`).join('')}</div>
    <form class="chat-scrivi" data-f="chat"><input name="t" autocomplete="off" placeholder="Scrivi a Clara" aria-label="Scrivi a Clara"><button aria-label="Manda">${ic('manda')}</button></form>`;
}
function claraA(p, testo, bottoni){
  S.chat[p].push(M(ora(), testo, bottoni));
  if(!(p===S.io && claraVisibile())) S.nonLetti[p] = (S.nonLetti[p]||0)+1;
}
function claraVisibile(){ return (S.vista==='clara') || (isLargo() && !S.claraChiusa[S.io]) || (!isTel() && document.body.classList.contains('clara-aperta')); }
function claraRisponde(p, testo){
  const t = testo.toLowerCase();
  S.chat[p].push({da:'io', t:ora(), testo});
  S.scrive = p; render();
  setTimeout(() => {
    S.scrive = null; tic();
    let r, b;
    const c = coda(p);
    if(/passagg|accett|carlo|alex|giacomo|salvatore|lorenzo|punto/.test(t)){
      const l = S.passaggi.filter(x => (x.da===p||x.a===p) && x.stato!=='fatto');
      r = l.length ? l.map(x => (x.da===p ? 'A '+nome(x.a) : 'Da '+nome(x.da))+', '+esc(x.titolo)+': '+esc(statoPass(x).t)+'.').join('<br>') : 'Nessun passaggio aperto. Tutto in mano a qualcuno.';
      b = [{l:'Apri i passaggi',a:'go',x:'passaggi'}];
    } else if(/ricord|domani/.test(t)){
      r = c[0] ? 'Va bene. Domani alle 9 ti rimetto in cima «'+esc(c[0].titolo)+'». Se succede qualcosa prima, ti scrivo subito.' : 'Va bene, domani alle 9 ti scrivo.';
    } else if(/grazie|ok|perfetto/.test(t)){
      r = 'Figurati.';
    } else if(/oggi|manca|fare|adesso|cosa/.test(t)){
      r = c.length ? 'Per te adesso:<br>'+c.slice(0,3).map((i,k)=>(k+1)+'. '+esc(i.titolo)+' <span style="color:var(--tenue)">('+esc(i.et)+')</span>').join('<br>') : 'Niente. La giornata per te è chiusa.';
      if(c[0]) b = [{l:c[0].btn, a:c[0].a, x:c[0].x}];
    } else {
      r = 'Questo non lo so ancora fare. Ti so dire cosa ti aspetta, a che punto sono i passaggi, e ricordarti una cosa alla persona giusta.';
    }

    return '';
  };
  const titoloV = (nav.find(n=>n[0]===S.vista)||[])[1] || {scheda:'Scheda',passaggio:'Passaggio',report:'Report'}[S.vista] || 'Oggi';
  const sub = ['scheda','passaggio','report'].includes(S.vista);
  app.className = chiusa ? 'senza-clara' : '';
  app.innerHTML = `
    <aside class="side" aria-label="Menu">
      <div class="marchio"><span class="marchio-m">SG</span><div><b>Studio Galilei</b><span>Workspace</span></div></div>
      <div class="vedi"><span class="eti">Vedi come</span><div class="vedi-g">${ORDINE.map(p=>{const u=urgenti(p);return `<button class="vedi-b ${S.io===p?'on':''}" data-a="vediCome" data-x="${p}" aria-pressed="${S.io===p}" title="${MESTIERE[p]}">${av(p,24)}<span>${nome(p)}</span>${u?`<span class="bdg">${u}</span>`:''}</button>`;}).join('')}</div></div>
      <nav class="nav">${nav.map(n=>`<a href="#${S.io}/${n[0]}" class="${S.vista===n[0]?'on':''}">${ic(n[2])}<span>${n[1]}</span>${bdgNav(n[0])}</a>`).join('')}</nav>
      <div class="side-piede"><b>${nome(S.io)}</b>${MESTIERE[S.io]}</div>
    </aside>
    <main class="main" id="main">
      <div class="topbar">${sub?`<button class="torna" style="margin:0;min-height:44px;min-width:44px" data-a="indietro" aria-label="Torna">${ic('indietro').replace('<svg','<svg style="width:22px;height:22px"')}</button>`:''}<span class="tt">${esc(titoloV)}${sub?'':'<small>'+dataTesta()+'</small>'}</span><button class="vedi-m" data-a="vediFoglio" aria-label="Vedi come: ${nome(S.io)}">${av(S.io,30)}${nome(S.io)}${ic('giu').replace('<svg','<svg style="width:16px;height:16px"')}</button></div>
      <div class="main-in">${main}</div>
    </main>
    <aside class="clara-p" aria-label="Clara">${S.vista==='clara'?'':chatHTML(S.io, true)}</aside>
    <button class="fab-clara ${largo && chiusa && S.vista!=='clara' ? 'vis' : ''}" data-a="apriClara">${av('clara',36)} Clara ${S.nonLetti[S.io]?`<span class="bdg">${S.nonLetti[S.io]}</span>`:''}</button>
    ${POL?`<div class="pollice"><button class="btn pieno" data-a="${POL.a}" data-x="${esc(POL.x||'')}" ${POL.dis?'disabled':''}>${esc(POL.l)}</button></div>`:''}
    <nav class="tabbar" aria-label="Sezioni">${nav.map(n=>`<a href="#${S.io}/${n[0]}" class="${S.vista===n[0]?'on':''}">${ic(n[2])}<span>${n[1]}</span>${bdgNav(n[0])}</a>`).join('')}</nav>`;
  const cm = app.querySelectorAll('[data-chat]'); cm.forEach(c => c.scrollTop = c.scrollHeight);
  document.title = titoloV+', '+nome(S.io)+': V5 la squadra';
}

/* ---------- eventi ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if(!el) return;
  if(el.tagName==='A') return;
  if(el.disabled) return;
  const a = el.dataset.a, x = el.dataset.x;
  if(el.dataset.m !== undefined && el.dataset.m !== ''){
    const msg = S.chat[S.io][+el.dataset.m];
    if(el.dataset.eco){ msg.usato = true; S.chat[S.io].push({da:'io', t:ora(), testo:el.dataset.l}); }
  }
  if(A[a]){ e.preventDefault(); A[a](x, el); }
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ chiudiFoglio(); if(document.body.classList.contains('clara-aperta')) A.chiudiClara(); }
  if(e.key==='Enter' && e.target.matches('tr[data-a]')) e.target.click();
});
document.addEventListener('submit', e => {
  if(e.target.dataset.f==='chat'){ e.preventDefault(); const v = e.target.t.value.trim(); if(!v) return; claraRisponde(S.io, v); }
});
document.addEventListener('input', e => {
  const b = e.target.dataset.bind; if(!b) return;
  const [k, ...r] = b.split('.'); const v = e.target.value;
  if(k==='conv') S.conv[r[0]].bozza = v;
  if(k==='fila') S.fila.find(f=>f.id===r[0]).bozza = v;
  if(k==='rep') S.report[r[0]].righe[+r[1]][1] = v;
  if(k==='no') S.nonOra.find(n=>n.id===r[0]).proposta = v || S.nonOra.find(n=>n.id===r[0]).proposta;
  if(k==='pass'){ const x = pass(r[0]);
    if(r[1]==='campi'){ x.campi[r[2]] = v; aggiornaManda(x, e.target); }
    if(r[1]==='domande') x.domande[r[2]] = v;
    if(r[1]==='risposta') x.risposta = v; }
});
function aggiornaManda(x, ta){
  const manca = CAMPI.filter(c=>!x.campi[c[0]].trim()).length;
  const l = manca ? 'Mancano '+manca+' campi' : 'Manda a '+nome(x.a);
  document.querySelectorAll('#btnManda, .pollice .btn').forEach(b => { b.textContent = l; b.disabled = !!manca; });
  const box = ta.closest('.campo5'); if(box){ const vuoto = !ta.value.trim(); box.classList.toggle('manca', vuoto); const p = box.querySelector('.pill.ambra'); if(p && !vuoto) p.remove(); }
}
window.addEventListener('hashchange', () => { leggiHash(); chiudiFoglio(); if(isTel()) document.body.classList.remove('clara-aperta'); render(); const m = document.getElementById('main'); if(m) m.scrollTop = 0; window.scrollTo(0,0); });
let lastW = innerWidth;
window.addEventListener('resize', () => { if(Math.abs(innerWidth-lastW) > 40){ lastW = innerWidth; render(); } });

leggiHash();
render();
})();
</script>
</body>
</html>
