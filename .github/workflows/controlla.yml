# Il cancello automatico: a ogni push GitHub rifà i controlli da solo.
# Serve a una cosa sola: che non finisca online una versione che non compila
# o che ha una regola di casa rotta. Non deve fare altro (7/9/2026).
name: controlla

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: compilatore, lint e prove
        run: npm run controlla
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # gli invarianti di Clara (24/9, da Galileo): se uno cade, il push non passa
      - name: gli invarianti di Clara
        run: python3 scripts/test_invarianti.py
      - name: build vera
        run: npm run build
