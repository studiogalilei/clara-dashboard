<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V2, il meglio delle piattaforme: Workspace Studio Galilei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { navy: '#1C2E6E', blu: '#2979C4', avorio: '#FAF8F4', inchiostro: '#1A1F2E', tenue: '#6B6F7B', velo: '#F1EEE8', bordo: '#E6E1D8', spento: '#A8A39A' },
    fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
  } } }
</script>
<style>
  html, body { height: 100%; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; color: #1A1F2E; background: #FAF8F4; -webkit-font-smoothing: antialiased; overflow: hidden; }
  .num { font-variant-numeric: tabular-nums; }
  .kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; font: 600 11px/1 'Plus Jakarta Sans', sans-serif; border: 1px solid #E6E1D8; border-bottom-width: 2px; border-radius: 6px; padding: 3px 5px; color: #6B6F7B; background: #fff; }
  .kbd-scuro { border-color: rgba(255,255,255,.35); color: rgba(255,255,255,.85); background: transparent; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; display: inline-block; }
  .btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 12px; font-weight: 700; font-size: 14px; padding: 0 16px; transition: background-color .15s ease-out, border-color .15s ease-out, color .15s ease-out; white-space: nowrap; }
  .btn-p { background: #2979C4; color: #fff; }
  .btn-p:hover { background: #1C2E6E; }
  .btn-p:disabled { opacity: .4; pointer-events: none; }
  .btn-s { background: #fff; color: #1C2E6E; border: 1px solid #E6E1D8; font-weight: 600; }
  .btn-s:hover { border-color: #A8A39A; }
  .btn-g { color: #6B6F7B; font-weight: 600; }
  .btn-g:hover { background: #F1EEE8; color: #1A1F2E; }
  @media (min-width: 768px) { .btn { min-height: 38px; } }
  .chip { min-height: 36px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid #E6E1D8; background: #fff; border-radius: 999px; padding: 0 12px; font-size: 13px; font-weight: 600; color: #1C2E6E; transition: border-color .15s ease-out, background-color .15s ease-out; }
  .chip:hover { border-color: #2979C4; }
  .chip.on { background: #1C2E6E; color: #fff; border-color: #1C2E6E; }
  @media (max-width: 767px) { .chip { min-height: 44px; } }
  .riga { transition: background-color .12s ease-out; }
  .riga:hover { background: #F6F3EE; }
  .sel { background: #EEF4FB !important; box-shadow: inset 3px 0 0 #2979C4; }
  *:focus-visible { outline: 2px solid #2979C4; outline-offset: 2px; border-radius: 8px; }
  .scivola { animation: scivola .2s ease-out; }
  @keyframes scivola { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sale { animation: sale .2s ease-out; }
  @keyframes sale { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  .appare { animation: appare .16s ease-out; }
  @keyframes appare { from { opacity: 0; } to { opacity: 1; } }
  .scrive span { width: 6px; height: 6px; border-radius: 99px; background: #A8A39A; display: inline-block; animation: salta 1s infinite ease-in-out; }
  .scrive span:nth-child(2) { animation-delay: .15s; } .scrive span:nth-child(3) { animation-delay: .3s; }
  @keyframes salta { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .scivola, .sale, .appare, .scrive span { animation: none; } }
  textarea { resize: none; }
  .no-bar { scrollbar-width: none; } .no-bar::-webkit-scrollbar { display: none; }
  .scroll-sottile::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-sottile::-webkit-scrollbar-thumb { background: #E6E1D8; border-radius: 8px; }
  .pb-tab { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  @media (min-width: 768px) { .pb-tab { padding-bottom: 32px; } }
  .sopra-tab { bottom: calc(72px + env(safe-area-inset-bottom)); }
  [contenteditable]:focus { outline: 2px solid #2979C4; outline-offset: -2px; background: #fff; }
  .card-drag { cursor: grab; }
  .card-drag.trascina { opacity: .5; }
  .col-sopra { background: #E8F1FA !important; box-shadow: inset 0 0 0 2px rgba(41,121,196,.35); }
</style>
</head>
<body>
<!-- V2, il meglio delle piattaforme. Ogni pattern preso da fuori ha un commento «da: piattaforma, perché». -->
<div id="radice" class="flex h-[100dvh] flex-col">
  <div id="striscia"></div>
  <div class="flex min-h-0 flex-1">
    <!-- da: Linear, perché una barra a sinistra stretta e fissa dice sempre dove sei, con i numeri solo dove c'è da fare -->
    <aside id="lato" class="hidden w-[236px] shrink-0 flex-col border-r border-bordo bg-[#F6F3EE] md:flex"></aside>
    <main class="flex min-h-0 min-w-0 flex-1 flex-col">
      <header id="testa" class="md:hidden"></header>
      <div id="vista" class="min-h-0 flex-1"></div>
    </main>
  </div>
  <!-- da: Apple iOS, perché sul telefono le sezioni stanno sotto il pollice, cinque al massimo -->
  <nav id="barra" class="md:hidden"></nav>
</div>
<div id="strato"></div>
<div id="avviso" aria-live="polite"></div>

<script src="dati.js"></script>
<script>
(() => {
'use strict'
const L = window.LAB
const clone = (o) => JSON.parse(JSON.stringify(o))
const OGGI = new Date(L.oggi + 'T12:00:00')
const giorniDa = (iso) => Math.round((OGGI - new Date(iso + 'T12:00:00')) / 864e5)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const $ = (sel, el = document) => el.querySelector(sel)
const mobile = () => window.innerWidth < 768

// ─ i colori che ritornano: ambra aspetta te, blu corre da solo, verde fatto, rosso fermo da troppo ─
const TONO = {
  ambra: { dot: '#F59E0B', bg: '#FEF3C7', fg: '#92400E' },
  blu: { dot: '#2979C4', bg: '#E8F1FA', fg: '#1E5A96' },
  verde: { dot: '#16A34A', bg: '#DCFCE7', fg: '#166534' },
  rosso: { dot: '#DC2626', bg: '#FEE2E2', fg: '#991B1B' },
  grigio: { dot: '#A8A39A', bg: '#F1EEE8', fg: '#57534E' },
}
const dot = (t) => `<span class="dot" style="background:${TONO[t].dot}"></span>`
const pill = (t, testo) => `<span class="pill" style="background:${TONO[t].bg};color:${TONO[t].fg}">${dot(t)}${esc(testo)}</span>`

const ICONE = {
  oggi: '<path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/><circle cx="12" cy="12" r="4"/>',
  posta: '<path d="M3 13h5l2 3h4l2-3h5"/><path d="M5.5 5h13l2.5 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/>',
  trattativa: '<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/>',
  clienti: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  clara: '<path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>',
  hey: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
  cerca: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  indietro: '<path d="M15 5l-7 7 7 7"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
  freccia: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  orologio: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  cestino: '<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>',
  tel: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/>',
  invia: '<path d="M4 12 20 4l-6 16-3-7z"/>',
  tastiera: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
}
const ico = (n, cls = 'h-5 w-5') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONE[n]}</svg>`

const persona = (id) => L.squadra.find((p) => p.id === id) || { id: 'clara', nome: 'Clara', colore: '#2979C4', ruolo: 'Assistente' }
const avatar = (id, size = 28) => {
  const p = persona(id)
  if (id === 'clara') return `<span class="inline-flex shrink-0 items-center justify-center rounded-full font-extrabold text-white" style="width:${size}px;height:${size}px;background:#2979C4;font-size:${Math.round(size * .42)}px" aria-label="Clara">C</span>`
  return `<span class="inline-flex shrink-0 items-center justify-center rounded-full font-bold text-white" style="width:${size}px;height:${size}px;background:${p.colore};font-size:${Math.round(size * .4)}px" aria-label="${esc(p.nome)}">${esc(p.nome[0])}</span>`
}

const TAPPA = { risposta: 'Risposta', analisi: 'Analisi mandata', follow_up: 'Follow-up', conoscitiva: 'Conoscitiva', tecnica: 'Tecnica', avvio: 'Avvio', prova: 'Prova 2 mesi', cliente: 'Cliente' }
const COLONNE = [
  { k: 'si', nome: 'Hanno detto sì', tappe: ['risposta', 'analisi', 'follow_up'] },
  { k: 'conoscitiva', nome: 'Call conoscitiva', tappe: ['conoscitiva'] },
  { k: 'tecnica', nome: 'Call tecnica', tappe: ['tecnica'] },
]
const VOCI = { oggi: 'Oggi', posta: 'Posta', trattativa: 'Trattativa', clienti: 'Clienti', clara: 'Clara' }
const NAV = {
  dre: ['oggi', 'posta', 'trattativa', 'clienti', 'clara'],
  carlo: ['oggi', 'clienti', 'trattativa', 'clara'],
  giacomo: ['oggi', 'trattativa', 'clienti', 'clara'],
  lorenzo: ['oggi', 'posta', 'clara'],
  salvatore: ['oggi', 'clienti', 'clara'],
  alex: ['oggi', 'clara'],
}
const COSA_VEDE = {
  dre: 'chi aspetta una sua decisione e la prossima call',
  carlo: 'i clienti appena passati, cosa parte, cosa è in ritardo',
  giacomo: 'tutto in una tabella: chi fa cosa, scadenze, soldi',
  lorenzo: 'risposte, consegne, caselle',
  salvatore: 'i suoi progetti e cosa gli è stato passato',
  alex: 'le task che gli arrivano',
}

// ─ lo stato del prototipo ─
const PROSSIMO = {
  a1: { cosa: 'Call conoscitiva', quando: 'oggi 15:00' },
  a2: { cosa: 'Call tecnica con Carlo', quando: 'gio 8, 15:30' },
  a3: { cosa: 'Follow-up pronto, da approvare', quando: 'oggi' },
  a4: { cosa: 'Aspettare che la legga, poi follow-up', quando: 'lun 12' },
  a5: { cosa: 'Approvare la risposta pronta', quando: 'oggi' },
  a6: { cosa: 'Ripresa pronta, da approvare', quando: 'oggi' },
  a7: { cosa: 'Avvio progetto', quando: 'lun 12, 10:00' },
  a8: { cosa: 'Accessi Google Ads (Alex)', quando: 'ieri' },
  a9: { cosa: 'Report di settembre (Salvatore)', quando: 'domani' },
  a10: { cosa: 'Chiamarlo al telefono', quando: 'oggi' },
}
const S = {
  who: 'dre', view: 'oggi', banner: true,
  az: clone(L.aziende).map((a) => ({ ...a, prossimo: { ...PROSSIMO[a.id] } })),
  task: clone(L.task).map((t) => ({ ...t, nota: t.id === 't1' ? 'Tecnica fatta il 3/10. Preventivo accettato, si parte lunedì 12. Budget pubblicitario ancora da definire con Davide.' : '' })),
  dec: {}, esito: {},
  posta: { split: 'te', sel: null, open: false, edit: {}, prima: {}, perche: {}, chiama: false },
  tratt: { vista: 'bacheca', col: 'si', focus: null, sort: 'stato' },
  scheda: null, layer: null, lascia: false,
  handoff: null, passo: null, pal: { q: '', i: 0 },
  hey: [
    { id: 'h1', a: 'carlo', da: 'dre', testo: 'Ti ho passato Impianti Solari Nord: la tecnica è fatta, si parte', quando: 'ieri 18:40', az: 'a7', task: 't1' },
    { id: 'h2', a: 'salvatore', da: 'giacomo', testo: 'Report di settembre per Cantina Le Vigne, entro domani', quando: 'ieri', az: 'a9', task: 't2' },
    { id: 'h3', a: 'alex', da: 'carlo', testo: 'Accessi Google Ads di Palestra Forma: servivano ieri', quando: 'lun 5', az: 'a8', task: 't3' },
    { id: 'h4', a: 'giacomo', da: 'dre', testo: 'Fattura della prova di Palestra Forma, entro venerdì', quando: 'lun 5', az: 'a8', task: 't4' },
    { id: 'h5', a: 'dre', da: 'lorenzo', testo: 'Officina Moretti ha risposto alla mia mail: chiede il prezzo', quando: '9:14', az: 'a5' },
    { id: 'h6', a: 'dre', da: 'clara', testo: 'Il preventivo di Riva lo preparo dalla tecnica di giovedì, non da una pagina vuota', quando: '8:02', az: 'a2' },
    { id: 'h7', a: 'lorenzo', da: 'clara', testo: '6 risposte stamattina, 4 consegne: nessun sì senza analisi', quando: '9:30' },
  ],
  letti: {},
  clara: {},
  claraNuovi: { dre: 1, carlo: 1, alex: 1 },
  undo: null,
}
const az = (id) => S.az.find((a) => a.id === id)
const cn = (id) => L.conversazioni.find((c) => c.id === id)
const fu = (id) => L.seguiti.find((s) => s.id === id)

// ─ Clara: un filo solo per persona, come una chat di WhatsApp ─
const CLARA_INIZIO = {
  dre: [
    { da: 'clara', ora: '8:00', t: 'Buongiorno Dre. Stanotte ho letto 14 fili: ti servono 4 decisioni, il resto corre da solo.', btn: [{ l: 'Inizia dalla prima', a: 'inizia' }] },
    { da: 'clara', ora: '8:01', t: 'Alle 15 c’è Ferramenta Bassi. Nella scheda ti ho messo dove eravate e le due cose scomode.', btn: [{ l: 'Apri la scheda', a: 'scheda:a1' }] },
    { da: 'clara', ora: '9:40', t: 'Edilnova vuole essere chiamato, non scritto. Lo chiami tu o glielo fisso giovedì alle 11?', btn: [{ l: 'Lo chiamo io', a: 'posta:c2' }, { l: 'Fissa giovedì alle 11', a: 'fissaEdilnova' }], chiede: true },
  ],
  carlo: [
    { da: 'clara', ora: '8:00', t: 'Ciao Carlo. Dre ti ha passato Impianti Solari Nord ieri sera: si parte lunedì. Nella nota c’è cosa gli abbiamo promesso.', btn: [{ l: 'Accetta', a: 'accetta:t1' }, { l: 'Apri la scheda', a: 'scheda:a7' }], chiede: true },
    { da: 'clara', ora: '8:05', t: 'Gli accessi di Palestra Forma aspettano Alex da ieri. Glielo ricordo io?', btn: [{ l: 'Sì, ricordaglielo', a: 'sollecita:t3' }] },
  ],
  giacomo: [
    { da: 'clara', ora: '8:00', t: 'Ciao Giacomo. Canone attivo 4.200 € al mese, una prova in corso. Una cosa in ritardo: gli accessi di Palestra Forma, li ha Alex.', btn: [{ l: 'Apri la tabella', a: 'vai:oggi' }] },
  ],
  lorenzo: [
    { da: 'clara', ora: '9:30', t: 'Ciao Lorenzo. Stamattina 6 risposte e 4 consegne, caselle sane al 91%. Nessun sì è rimasto senza analisi.', btn: [] },
  ],
  salvatore: [
    { da: 'clara', ora: '8:00', t: 'Ciao Salvatore. Il report di settembre di Cantina Le Vigne è per domani: i numeri del mese sono già nel foglio.', btn: [{ l: 'Apri la scheda', a: 'scheda:a9' }] },
  ],
  alex: [
    { da: 'clara', ora: '8:00', t: 'Ciao Alex. Gli accessi Google Ads di Palestra Forma servivano ieri a Carlo. Se ti blocca qualcosa dimmelo e glielo giro.', btn: [{ l: 'Fatto', a: 'fatto:t3' }, { l: 'Mi blocca qualcosa', a: 'blocco:t3' }], chiede: true },
  ],
}
const filoClara = () => (S.clara[S.who] ||= clone(CLARA_INIZIO[S.who] || []))
const ORA = () => { const d = new Date(); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}` }

// ─ la posta ─
const FILO_FU = {
  s1: [{ chi: 'noi', quando: '12/9', testo: 'Le lascio l’analisi su Serramenti Vetta: come vi trovano su Google, chi vi passa davanti, dove si perdono richieste.' }],
  s2: [{ chi: 'noi', quando: '22/7', testo: 'Le lascio l’analisi su Pasticceria Dolce Vita prima delle ferie: la guardi con calma.' }],
  auto1: [
    { chi: 'noi', quando: '30/9', testo: 'Buongiorno, sono Lorenzo di Studio Galilei. Abbiamo preparato un’analisi gratuita su come l’Agriturismo appare su Google: le interessa?' },
    { chi: 'loro', quando: '3/10', testo: 'Sì, mandatela pure, grazie.' },
    { chi: 'noi', quando: '4/10', testo: 'Ecco l’analisi su Colle Verde, in allegato. Se le va ne parliamo in venti minuti.', clara: true },
  ],
}
const PERCHE = {
  c1: 'Ha chiesto il prezzo. Per mail non lo diamo, perché dipende dal lavoro: analisi in allegato e una call di venti minuti. Giovedì alle 15 è il primo buco libero nel tuo calendario.',
  s1: 'Silenzio da 24 giorni dopo l’analisi. Un richiamo leggero, una domanda facile (due righe) e la call: niente pressione.',
  s2: 'In mezzo ci sono state le ferie. Riparto dal Natale, che per una pasticceria è il periodo che pesa di più.',
}
function postaListe() {
  const te = L.conversazioni.filter((c) => !S.dec[c.id]).map((c) => ({ id: c.id, k: 'conv', az: c.azienda, perche: c.perche, meta: c.aspetta, tono: 'ambra' }))
  const fila = L.seguiti.filter((s) => !S.dec[s.id]).map((s) => ({ id: s.id, k: 'fu', az: s.azienda, perche: s.perche, meta: s.giorno.replace(/ ottobre.*/, '').replace('giovedì', 'gio').replace('venerdì', 'ven'), tono: 'ambra' }))
  const fatte = [...L.conversazioni.map((c) => ({ ...c, k: 'conv' })), ...L.seguiti.map((s) => ({ ...s, k: 'fu' }))].filter((x) => S.dec[x.id])
  const STATO = {
    approvata: ['ambra', 'approvata, da incollare su Smartlead'], mandata: ['verde', 'mandata da Smartlead'],
    rimandata: ['blu', 'torna domani alle 9'], chiamato: ['verde', 'chiamato'], lasciata: ['grigio', 'lasciata stare'],
  }
  const corsa = [
    ...fatte.filter((x) => S.dec[x.id] !== 'lasciata').map((x) => ({ id: x.id, k: x.k, az: x.azienda, tono: STATO[S.dec[x.id]][0], perche: S.dec[x.id] === 'chiamato' ? `chiamato: ${S.esito[x.id] || ''}` : STATO[S.dec[x.id]][1], meta: 'oggi' })),
    { id: 'auto1', k: 'auto', az: 'a4', tono: 'blu', perche: 'analisi partita da sola il 4/10, ora tocca a lei', meta: '4/10' },
    ...fatte.filter((x) => S.dec[x.id] === 'lasciata').map((x) => ({ id: x.id, k: x.k, az: x.azienda, tono: 'grigio', perche: 'lasciata stare', meta: 'oggi' })),
  ]
  return { te, fila, corsa }
}
const SPLIT = [{ k: 'te', nome: 'Aspettano te' }, { k: 'fila', nome: 'Follow-up' }, { k: 'corsa', nome: 'In corsa' }]
const filoDi = (id) => cn(id)?.filo || FILO_FU[id] || []
const bozzaDi = (id) => S.posta.edit[id] ?? (cn(id)?.bozza ?? fu(id)?.bozza ?? null)
const decisi = () => [...L.conversazioni, ...L.seguiti].filter((x) => S.dec[x.id] && S.dec[x.id] !== 'rimandata').length
const daDecidere = () => { const p = postaListe(); return p.te.length + p.fila.length }

// ─ stato di un'azienda, in parole e a colori ─
function statoAz(a) {
  const g = giorniDa(a.ultima)
  if (S.task.some((t) => t.azienda === a.id && t.stato === 'in ritardo')) return { t: 'task in ritardo', c: 'rosso' }
  if (a.tappa === 'cliente') return { t: 'cliente, retainer', c: 'verde' }
  if (a.palla === 'carlo' || a.palla === 'salvatore') {
    const att = S.task.find((t) => t.azienda === a.id && t.stato === 'da accettare')
    return att ? { t: `aspetta che ${persona(att.a).nome} la prenda`, c: 'ambra' } : { t: `la segue ${persona(a.palla).nome}`, c: 'blu' }
  }
  if (a.palla === 'loro' && g > 14) return { t: `fermo da ${g} giorni`, c: 'rosso' }
  if (a.palla === 'noi') return { t: S.who === 'dre' ? 'aspetta te' : 'aspetta Dre', c: 'ambra' }
  return { t: 'la palla è a loro', c: 'blu' }
}

// ─ navigazione ─
function vai(v) {
  if (!NAV[S.who].includes(v)) return
  S.view = v; S.scheda = null; S.layer = null; S.posta.open = false
  if (v === 'clara') S.claraNuovi[S.who] = 0
  if (v === 'posta') primoInPosta()
  history.replaceState(null, '', '#' + v)
  render()
}
function primoInPosta() {
  const p = postaListe()
  if (!S.posta.sel || ![...p.te, ...p.fila, ...p.corsa].some((x) => x.id === S.posta.sel)) {
    const split = p.te.length ? 'te' : p.fila.length ? 'fila' : 'corsa'
    S.posta.split = split
    S.posta.sel = p[split][0]?.id || null
  }
}
function apriInPosta(id) {
  const p = postaListe()
  const split = p.te.some((x) => x.id === id) ? 'te' : p.fila.some((x) => x.id === id) ? 'fila' : 'corsa'
  S.view = 'posta'; S.scheda = null; S.layer = null
  S.posta.split = split; S.posta.sel = id; S.posta.open = true; S.posta.chiama = false
  history.replaceState(null, '', '#posta')
  render()
}

  const p = postaListe()

  if (incollare.length) righe.push({ tono: 'ambra', nome: `${incollare.length} ${incollare.length > 1 ? 'approvate' : 'approvata'} da incollare su Smartlead`, sotto: 'poi segna «Fatto, l’ho mandata»', act: `posta:${incollare[0].id}`, cta: 'Vai' })
  L.call.filter((c) => c.quando.startsWith('oggi')).forEach((c) => righe.push({ tono: 'ambra', nome: `Call con ${az(c.azienda).nome}`, sotto: `${c.tipo.toLowerCase()} alle ${c.quando.slice(5)}: la scheda è pronta`, meta: c.quando.slice(5), act: `scheda:${c.azienda}`, cta: 'Prepara la call' }))
  S.task.filter((t) => t.a === 'dre' && t.stato !== 'fatto').forEach((t) => righe.push({ tono: 'blu', nome: t.titolo, sotto: `entro ${t.scadenza}, nasce dalla tecnica`, meta: t.scadenza, act: `scheda:${t.azienda}`, cta: 'Apri' }))

  const n = p.te.length + p.fila.length
  const primo = p.te[0] || p.fila[0]
  const fuDovuti = L.seguiti.filter((s) => S.dec[s.id] !== 'lasciata').length
  const fuPartiti = L.seguiti.filter((s) => S.dec[s.id] === 'mandata').length
  const convFatte = L.conversazioni.filter((c) => S.dec[c.id] && S.dec[c.id] !== 'rimandata').length
  const chiusa = n === 0 && !incollare.length && fuPartiti >= fuDovuti

  else if (incollare.length) { titolo = 'Manca un passo'; sotto = `${incollare.length} ${incollare.length > 1 ? 'approvate aspettano' : 'approvata aspetta'} di essere incollate su Smartlead.`; bottone = `<button data-a="posta:${incollare[0].id}" class="btn btn-p">Vai alla prima ${ico('freccia', 'h-4 w-4')}</button>` }
  else { titolo = chiusa ? 'Giornata chiusa' : 'Decisioni finite'; sotto = 'Tutti i sì hanno l’analisi, i follow-up dovuti sono partiti. Alle 15 c’è Bassi: la scheda è pronta.'; bottone = `<button data-a="scheda:a1" class="btn btn-s">Prepara la call delle 15</button>` }

  const giornata = [
    { ok: L.outbound.siSenzaAnalisi === 0, t: 'Sì con l’analisi', v: 'tutti' },

    { ok: fuPartiti >= fuDovuti, t: 'Follow-up partiti', v: `${fuPartiti} di ${fuDovuti}` },

  const t1 = S.task.find((t) => t.id === 't1')
  const corre = [
    { tono: 'blu', t: 'Agriturismo Colle Verde', s: 'analisi partita da sola il 4/10' },
    t1.stato === 'da accettare' ? { tono: 'ambra', t: 'Impianti Solari Nord', s: 'passata a Carlo ieri, non l’ha ancora presa' } : { tono: 'verde', t: 'Impianti Solari Nord', s: 'Carlo l’ha presa, si parte lunedì' },
    { tono: 'blu', t: 'Palestra Forma', s: 'prova, giorno 21 di 60' },
    { tono: 'rosso', t: 'Accessi di Palestra Forma', s: 'Alex, in ritardo da ieri' },
    ...S.task.filter((t) => t.id.startsWith('n')).map((t) => ({ tono: t.stato === 'da accettare' ? 'ambra' : 'verde', t: az(t.azienda).nome, s: t.stato === 'da accettare' ? 'passata a Carlo, non l’ha ancora presa' : 'Carlo l’ha presa' })),

  return contenitore(`
    <!-- da: Things 3, perché «Oggi» è una pagina calma: la data piccola, una frase grande, un solo bottone -->

        <div class="mt-5 hidden md:block">${bottone}</div>
        <div class="mt-8">
          ${sezione('Adesso', righe.length)}
          ${carta(righe.length ? `<div class="px-2">${righe.map(rigaAzione).join('')}</div>` : `<p class="p-5 text-[14px] text-tenue">Niente che aspetti te.</p>`)}
        </div>

      <div class="min-w-0">

          <span class="flex h-6 w-6 items-center justify-center rounded-full ${g.ok ? 'bg-[#DCFCE7] text-[#166534]' : 'border-2 border-[#F59E0B]'}">${g.ok ? ico('check', 'h-4 w-4') : ''}</span>
          <span class="flex-1 text-[14px] font-semibold">${g.t}</span><span class="num text-[13px] font-bold ${g.ok ? 'text-[#166534]' : 'text-[#92400E]'}">${g.v}</span></div>`).join('')}</div>`)}
        ${sezione('Agenda', null)}
        ${carta(`<div class="divide-y divide-bordo/70">${L.call.map((c) => `<button data-a="scheda:${c.azienda}" class="riga flex w-full items-center gap-3 px-4 py-3 text-left">
          <span class="num w-[96px] shrink-0 text-[13px] font-bold text-navy">${esc(c.quando.replace('giovedì', 'gio').replace('lunedì', 'lun'))}</span>

      </div>

  const n = daPrendere.length + ritardo.length

  const prova = az('a8')
  const bott = daPrendere[0] ? `<button data-a="accetta:${daPrendere[0].id}" class="btn btn-p">Prendi ${esc(az(daPrendere[0].azienda).nome)} <span class="kbd kbd-scuro hidden md:inline-flex">↵</span></button>` : ''

    <p class="text-[13px] font-semibold text-tenue">${dataOggi}</p>

    <p class="mt-2 text-[15px] text-inchiostro/80">${daPrendere.length ? `${daPrendere.length === 1 ? 'Un cliente appena passato' : daPrendere.length + ' clienti appena passati'} da prendere, ${ritardo.length} in ritardo che aspetta Alex.` : 'I clienti passati sono tuoi. Lunedì parte Impianti Solari Nord.'}</p>

  const aperta = S.posta.open
  const decide = S.who === 'dre'

        ${SPLIT.map((s) => { const on = S.posta.split === s.k; return `<button role="tab" aria-selected="${on}" data-a="split:${s.k}" class="flex min-h-[40px] items-center gap-1.5 rounded-xl px-3 text-[13px] ${on ? 'bg-navy font-bold text-white' : 'font-semibold text-tenue hover:bg-velo'}">${s.nome}<span class="num text-[12px] ${on ? 'text-white/70' : ''}">${p[s.k].length}</span></button>` }).join('')}
      </div>
      <div class="min-h-0 flex-1 overflow-y-auto scroll-sottile pb-tab md:pb-4">
        ${lista.length ? lista.map((x) => { const a = az(x.az); const ul = filoDi(x.id).slice(-1)[0]; return `
          <button data-a="apri:${x.id}" class="riga flex w-full items-start gap-3 border-b border-bordo/60 px-5 py-3.5 text-left ${x.id === sel && !mobile() ? 'sel' : ''}">
            <span class="mt-2">${dot(x.tono)}</span>
            <span class="min-w-0 flex-1">
              <span class="flex items-baseline gap-2"><span class="truncate text-[15px] ${x.tono === 'grigio' ? 'font-semibold text-tenue' : 'font-bold text-navy'}">${esc(a.nome)}</span><span class="num ml-auto shrink-0 text-[12px] font-semibold text-tenue">${esc(x.meta)}</span></span>
              <span class="mt-0.5 block truncate text-[13px] font-semibold text-inchiostro/80">${esc(x.perche)}</span>
              ${ul ? `<span class="mt-0.5 block truncate text-[13px] text-tenue">${ul.chi === 'loro' ? esc(a.persona.split(' ')[0]) + ': ' : 'Noi: '}${esc(ul.testo)}</span>` : ''}

    <section class="${aperta ? 'flex' : 'hidden md:flex'} min-h-0 min-w-0 flex-1 flex-col bg-white">
      ${sel && itemPosta(sel) ? lettore(sel, decide) : postaZero(p)}
    </section>
  </div>`
}
function vuotoSplit(p) {
  const k = SPLIT.find((x) => x.k !== S.posta.split && p[x.k].length)
  const altro = k ? `<button data-a="split:${k.k}" class="btn btn-s mt-4">Vai a ${k.nome.toLowerCase()} (${p[k.k].length})</button>` : ''
  return `<div class="px-6 py-12 text-center"><span class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-[#DCFCE7] text-[#166534]">${ico('check', 'h-6 w-6')}</span><p class="mt-3 text-[15px] font-bold text-navy">Vuoto</p>${altro}</div>`
}
function postaZero(p) {
  const incollare = p.corsa.filter((x) => S.dec[x.id] === 'approvata')
  // da: Superhuman, perché la posta a zero è un premio: si dice, e si dice cosa manca ancora
  return `<div class="m-auto max-w-[420px] px-8 py-16 text-center">
    <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-[#DCFCE7] text-[#166534]">${ico('check', 'h-7 w-7')}</span>
    <h2 class="mt-4 text-[22px] font-extrabold text-navy">Posta a zero</h2>
    <p class="mt-2 text-[14px] leading-relaxed text-tenue">${incollare.length ? `Manca un passo: ${incollare.length} ${incollare.length > 1 ? 'approvate da incollare' : 'approvata da incollare'} su Smartlead, poi «Fatto, l’ho mandata».` : 'Ogni risposta ha la sua decisione e i follow-up sono partiti.'}</p>
    ${incollare.length ? `<button data-a="apri:${incollare[0].id}" class="btn btn-p mt-5">Vai alla prima</button>` : `<button data-a="vai:oggi" class="btn btn-s mt-5">Torna a Oggi</button>`}
  </div>`
}
function itemPosta(id) { const p = postaListe(); return [...p.te, ...p.fila, ...p.corsa].find((x) => x.id === id) }

function lettore(id, decide) {
  const x = itemPosta(id)
  const a = az(x.az)
  const c = cn(id), s = fu(id)
  const bozza = bozzaDi(id)
  const d = S.dec[id]
  const filo = filoDi(id)
  const attiva = !d && x.k !== 'auto'
  const sintesi = c ? c.perche : s ? s.perche + ': ripresa pronta, propone ' + s.giorno : x.perche
  return `
    <div class="flex items-center gap-2 border-b border-bordo px-2 py-2 md:px-6 md:py-3">
      <button data-a="chiudiPosta" class="flex h-11 w-11 items-center justify-center rounded-xl text-navy hover:bg-velo md:hidden" aria-label="Torna alla lista">${ico('indietro')}</button>

    </div>
    <div class="min-h-0 flex-1 overflow-y-auto scroll-sottile">
      <div class="mx-auto max-w-[720px] px-4 py-5 ${attiva && decide ? 'pb-36 md:pb-8' : 'pb-24 md:pb-8'} md:px-8">
        <!-- da: Superhuman AI, perché in cima al filo c'è il riassunto in una riga: si capisce prima di leggere -->
        <div class="mb-5 flex items-start gap-2.5 rounded-2xl bg-[#E8F1FA]/70 px-3.5 py-2.5">${avatar('clara', 22)}<p class="text-[13px] leading-relaxed text-[#1E5A96]"><span class="font-bold">Clara:</span> ${esc(sintesi)}${c ? `, aspetta ${esc(c.aspetta)}` : ''}.</p></div>
        ${filo.map((m) => `<div class="mb-3 flex ${m.chi === 'noi' ? 'justify-end' : 'justify-start'}">
          <div class="max-w-[86%] rounded-2xl px-4 py-2.5 text-[14px] leading-relaxed ${m.chi === 'noi' ? 'rounded-br-md bg-navy text-white' : 'rounded-bl-md border border-bordo bg-avorio'}">
            <p class="whitespace-pre-wrap">${esc(m.testo)}</p>
            <p class="mt-1 text-right text-[11px] ${m.chi === 'noi' ? 'text-white/60' : 'text-tenue'}">${m.chi === 'noi' ? (m.clara ? 'partita da sola, ' : 'Lorenzo, ') : esc(a.persona.split(' ')[0]) + ', '}${esc(m.quando)}</p>
          </div></div>`).join('')}
        ${bozza !== null && !d ? bloccoBozza(id, bozza, decide) : ''}
        ${c && !c.bozza && !d ? bloccoChiamata(id, a, decide) : ''}
        ${d || x.k === 'auto' ? bloccoStato(id, x) : ''}
        ${!decide && attiva ? `<p class="mt-4 rounded-xl bg-velo px-4 py-3 text-[13px] text-tenue">La decisione è di Dre: qui vedi le risposte alle tue mail.</p>` : ''}
      </div>
    </div>
    ${attiva && decide && bozza !== null ? barraDecisione(id) : ''}`
}

function bloccoBozza(id, bozza, decide) {
  const prima = S.posta.prima[id]
  return `<div class="mt-5 rounded-2xl border-2 border-dashed border-blu/40 bg-[#F4F8FD] p-3 md:p-4">

    ${S.posta.perche[id] ? `<p class="mb-2 rounded-xl bg-white px-3 py-2 text-[13px] leading-relaxed text-inchiostro/80">${esc(PERCHE[id] || '')}</p>` : ''}

function prossimo(idFatto, listePrima) {

  const p = postaListe()

  const i = lista.findIndex((x) => x.id === idFatto)
  const resto = p[S.posta.split]
  let n = resto[Math.min(i, resto.length - 1)]
  if (!n) {
    const altro = SPLIT.map((s) => s.k).find((k) => k !== 'corsa' && p[k].length)
    if (altro) { S.posta.split = altro; n = p[altro][0] }
  }
  S.posta.sel = n ? n.id : null
  if (!n) S.posta.open = !mobile() ? false : true
}
function decidi(id, cosa, testoAvviso) {

  S.dec[id] = cosa
  if (cosa === 'approvata') { const x = az((cn(id) || fu(id)).azienda); x.palla = 'loro'; x.ultimaPrima = x.ultima; x.ultima = L.oggi }
  prossimo(id, prima)
  render()
  avviso(testoAvviso, () => { if (vecchio.dec) S.dec[id] = vecchio.dec; else delete S.dec[id]; { const x = az((cn(id) || fu(id)).azienda); x.palla = vecchio.palla; if (x.ultimaPrima) x.ultima = x.ultimaPrima } S.posta.split = vecchio.split; S.posta.sel = id; S.posta.open = vecchio.open; render() })
}

  switch (k) {

    case 'apri': S.posta.sel = v; S.posta.open = true; S.posta.chiama = false; render(); if (!mobile()) $(`[data-a="apri:${v}"]`)?.scrollIntoView({ block: 'nearest' }); break
    case 'chiudiPosta': S.posta.open = false; render(); break
    case 'split': S.posta.split = v; S.posta.sel = postaListe()[v][0]?.id || S.posta.sel; render(); break

    case 'esito': { const [id, ...e] = v.split(':'); S.esito[id] = e.join(':'); const az10 = az(cn(id).azienda); const prima = { ...az10.prossimo }; if (/Fissata/.test(S.esito[id])) az10.prossimo = { cosa: 'Call conoscitiva', quando: 'gio 8, 11:00' }; else if (/richiamare/.test(S.esito[id])) az10.prossimo = { cosa: 'Richiamarlo', quando: 'domani' }; decidi(id, 'chiamato', `${az10.nome}: ${S.esito[id].toLowerCase()}`); break }
    case 'mandata': { S.dec[v] = 'mandata'; render(); avviso('Segnata come mandata. La giornata avanza', () => { S.dec[v] = 'approvata'; render() }); break }
    case 'copia': copia(bozzaDi(v)); avviso('Copiata di nuovo'); break

    case 'perche': S.posta.perche[v] = !S.posta.perche[v]; { const ta = $(`[data-bozza="${v}"]`); if (ta) S.posta.edit[v] = ta.value } render(); break
    case 'riscrivi': { const [id, modo] = v.split(':'); riscrivi(id, modo); break }
    case 'scheda': S.scheda = v; S.layer = null; S.lascia = false; render(); break
    case 'chiudiScheda': S.scheda = null; S.lascia = false; render(); break

    case 'pal': { const c = comandi()[+v]; S.layer = null; if (c) act(c.a); else render(); break }
    case 'aiuto': S.layer = 'aiuto'; render(); break

    case 'tuttiLetti': heyMiei().forEach((h) => (S.letti[h.id] = true)); render(); break
    case 'heyApri': { const h = S.hey.find((x) => x.id === v); S.letti[v] = true; S.layer = null; if (h.az === 'a5' && S.who === 'dre' && !S.dec.c1) apriInPosta('c1'); else if (h.az) act('scheda:' + h.az); else render(); break }

// ─ la tastiera ─
// da: Linear, perché ogni azione frequente sta a uno o due tasti, e «?» le dice tutte
let attesaG = false
document.addEventListener('keydown', (e) => {
  const t = e.target
  const campo = t.matches('input, textarea, [contenteditable="true"]')
  const meta = e.metaKey || e.ctrlKey
  const k = e.key
  if (meta && k.toLowerCase() === 'k') { e.preventDefault(); act('palette'); return }
  if (meta && k.toLowerCase() === 'j') { e.preventDefault(); act('chiedi'); return }
  if (meta && k === 'Enter') {
    if (S.layer === 'passa') { e.preventDefault(); confermaPassa(); return }
    if (t.dataset.bozza && S.who === 'dre') { e.preventDefault(); approva(t.dataset.bozza); return }
  }
  if (S.layer === 'palette' && (k === 'ArrowDown' || k === 'ArrowUp' || k === 'Enter')) {
    e.preventDefault()
    const n = comandi().length
    if (k === 'Enter') { act('pal:' + S.pal.i); return }
    S.pal.i = (S.pal.i + (k === 'ArrowDown' ? 1 : -1) + n) % n
    $('#pal-lista').innerHTML = paletteLista(); $('#pal-lista .bg-\\[\\#E8F1FA\\]')?.scrollIntoView({ block: 'nearest' })
    return
  }
  if ((S.layer === 'chiedi' || S.view === 'clara') && t.dataset.input && (t.dataset.input === 'chiedi' || t.dataset.input === 'chat') && k === 'Enter' && !e.shiftKey) { e.preventDefault(); t.form.requestSubmit(); return }
  if (k === 'Escape') {
    if (campo && !S.layer) { t.blur(); return }
    if (S.layer) { S.layer = null; render(); return }
    if (S.lascia) { S.lascia = false; render(); return }
    if (S.scheda) { S.scheda = null; render(); return }
    if (S.view === 'posta' && S.posta.open && mobile()) { S.posta.open = false; render(); return }
    return
  }
  if (campo || meta || e.altKey) return
  if (S.layer) return
  if (k === '?') { act('aiuto'); return }
  if (k.toLowerCase() === 'z' && S.undo) { act('annulla'); return }
  if (k.toLowerCase() === 'v') { act('come'); return }
  if (/^[1-5]$/.test(k) && NAV[S.who][+k - 1]) { vai(NAV[S.who][+k - 1]); return }
  if (S.scheda) {
    if (k.toLowerCase() === 'p' && az(S.scheda).tappa === 'tecnica') passa(S.scheda)
    return
  }
  if (S.view === 'oggi' && k === 'Enter') {
    const b = $('#vista .btn-p'); if (b) { e.preventDefault(); b.click() }
    return
  }
  if (S.view === 'posta') {
    const p = postaListe(); const l = p[S.posta.split]; const i = l.findIndex((x) => x.id === S.posta.sel)
    if (k === 'j' || k === 'ArrowDown') { e.preventDefault(); const n = l[Math.min(i + 1, l.length - 1)]; if (n) act('apri:' + n.id) }
    else if (k === 'k' || k === 'ArrowUp') { e.preventDefault(); const n = l[Math.max(i - 1, 0)]; if (n) act('apri:' + n.id) }
    else if (k === 'Tab') { e.preventDefault(); const ks = SPLIT.map((s) => s.k); act('split:' + ks[(ks.indexOf(S.posta.split) + (e.shiftKey ? 2 : 1)) % 3]) }
    else if (k === 'Enter') { e.preventDefault(); if (mobile()) S.posta.open = true; render(); $('[data-bozza]')?.focus() }
    else if (S.posta.sel && S.who === 'dre' && itemPosta(S.posta.sel) && !S.dec[S.posta.sel] && itemPosta(S.posta.sel).k !== 'auto') {
      const id = S.posta.sel
      if (k.toLowerCase() === 'e' && bozzaDi(id) !== null) approva(id)
      else if (k === '#') act('lascia:' + id)
      else if (k.toLowerCase() === 'h') act('rimanda:' + id)
      else if (k.toLowerCase() === 's') act('scheda:' + itemPosta(id).az)
    } else if (k.toLowerCase() === 's' && S.posta.sel && itemPosta(S.posta.sel)) act('scheda:' + itemPosta(S.posta.sel).az)
    return
  }
  if (S.view === 'trattativa') {
    if (k.toLowerCase() === 'b') { S.tratt.vista = S.tratt.vista === 'bacheca' ? 'tabella' : 'bacheca'; render(); return }
    if (S.tratt.vista !== 'bacheca') return
    const tutte = inTratt()
    const cols = COLONNE.map((c) => tutte.filter((a) => colDi(a) === c.k).sort((x, y) => ordStato(x) - ordStato(y)))
    let ci = 0, ri = 0
    if (S.tratt.focus) { ci = cols.findIndex((c) => c.some((a) => a.id === S.tratt.focus)); ri = Math.max(0, cols[ci]?.findIndex((a) => a.id === S.tratt.focus)); if (ci < 0) ci = 0 }
    const metti = (c, r) => { const col = cols[c]; if (!col?.length) return false; S.tratt.focus = col[Math.min(r, col.length - 1)].id; render(); return true }
    if (k === 'ArrowRight' && e.shiftKey && S.tratt.focus) { e.preventDefault(); act('avanti:' + S.tratt.focus); return }
    if (k === 'ArrowDown' || k === 'j') { e.preventDefault(); if (!S.tratt.focus) metti(0, 0); else metti(ci, ri + 1) }
    else if (k === 'ArrowUp' || k === 'k') { e.preventDefault(); metti(ci, Math.max(0, ri - 1)) }
    else if (k === 'ArrowRight' || k === 'l') { e.preventDefault(); for (let c = ci + 1; c < 3; c++) if (metti(c, ri)) break }
    else if (k === 'ArrowLeft' || k === 'h') { e.preventDefault(); for (let c = ci - 1; c >= 0; c--) if (metti(c, ri)) break }
    else if (k === 'Enter' && S.tratt.focus) { e.preventDefault(); act('scheda:' + S.tratt.focus) }
    else if (k.toLowerCase() === 'p' && S.tratt.focus && az(S.tratt.focus).tappa === 'tecnica') passa(S.tratt.focus)
  }
})
document.addEventListener('focusin', (e) => { const c = e.target.closest?.('[data-card]'); if (c) S.tratt.focus = c.dataset.card })
window.addEventListener('resize', () => { clearTimeout(window.__r); window.__r = setTimeout(render, 120) })

// ─ partenza: la sezione dall'indirizzo ─
const h = location.hash.slice(1)
if (VOCI[h]) { S.view = h; if (h === 'posta') primoInPosta() }
render()
})()
</script>
