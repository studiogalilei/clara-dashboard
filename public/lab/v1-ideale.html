<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>V1, come dovrebbe essere: Workspace Studio Galilei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1C2E6E; --blu:#2979C4; --blu-scuro:#1F63A6; --avorio:#FAF8F4;
  --ink:#151A2D; --tenue:#5F6678; --spento:#9AA0AE; --bordo:#E6E1D7; --velo:#F2EEE6; --bianco:#fff;
  --ambra:#9A4B06; --ambra-bg:#FDF1D8; --ambra-dot:#F0A020;
  --corre:#1F63A6; --corre-bg:#E5EFF9; --corre-dot:#2979C4;
  --verde:#166534; --verde-bg:#DFF5E6; --verde-dot:#22A55A;
  --rosso:#B42318; --rosso-bg:#FDE4E1; --rosso-dot:#E5483B;
  --r:16px; --ease:cubic-bezier(.2,.8,.2,1);
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--avorio);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
textarea,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px;border-radius:8px}
.tab{font-variant-numeric:tabular-nums}

/* striscia del laboratorio */
#striscia{flex-shrink:0;display:flex;align-items:center;justify-content:center;height:30px;background:var(--navy);color:#fff;font-size:12px;font-weight:600;position:relative;padding:0 44px}
#striscia span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#striscia button{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:5;width:44px;height:44px;color:#fff;opacity:.8;font-size:18px;line-height:1}
#striscia button:hover{opacity:1}

/* telaio */
#top{display:none}
.telaio{flex:1;min-height:0;display:flex}
#rail{width:232px;flex-shrink:0;border-right:1px solid var(--bordo);padding:18px 12px 16px;display:flex;flex-direction:column;gap:2px;background:var(--avorio)}
#main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
#pollice,#tabbar{display:none}

.marchio{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.marchio b{font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.marchio small{display:block;font-size:11px;color:var(--tenue);font-weight:600;margin-top:-2px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--navy);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}

.come{position:relative;display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:8px 10px;border:1px solid var(--bordo);border-radius:12px;background:#fff;min-height:44px}
.come:hover{border-color:#D3CCBE}
.come select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.come .et{font-size:11px;color:var(--tenue);font-weight:600;line-height:1.1}
.come .nm{font-size:13px;font-weight:700;color:var(--ink);line-height:1.2}
.come .fr{margin-left:auto;color:var(--tenue)}

.voce{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;color:var(--tenue);font-weight:600;font-size:14px;text-align:left;width:100%;transition:background-color .15s var(--ease),color .15s var(--ease)}
.voce svg{width:20px;height:20px;flex-shrink:0}
.voce:hover{background:var(--velo);color:var(--ink)}
.voce.on{background:#fff;color:var(--navy);box-shadow:0 0 0 1px var(--bordo)}
.voce .num{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--ambra-bg);color:var(--ambra);font-size:12px;font-weight:800;display:grid;place-items:center}
.rail-piede{margin-top:auto;padding:12px 10px 0;font-size:12px;color:var(--tenue);border-top:1px solid var(--bordo)}

/* avatar */
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex-shrink:0}
.av.s{width:22px;height:22px;font-size:10px}
.av.clara{background:var(--blu)}

/* pagina */
.pagina{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.dentro{max-width:1120px;margin:0 auto;padding:28px 32px 48px}
.testa{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px}
.testa h1{margin:0;font-size:26px;line-height:1.2;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.testa .data{font-size:13px;color:var(--tenue);font-weight:600;margin-bottom:4px}
.griglia{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}

.carta{background:#fff;border:1px solid var(--bordo);border-radius:var(--r)}
.carta.pad{padding:20px}
.et-sez{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tenue);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.et-sez .tab{color:var(--spento)}

/* pillole di stato: colore + parola, sempre */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ambra{background:var(--ambra-bg);color:var(--ambra)}
.pill.ambra::before{background:var(--ambra-dot)}
.pill.blu{background:var(--corre-bg);color:var(--corre)}
.pill.blu::before{background:var(--corre-dot)}
.pill.verde{background:var(--verde-bg);color:var(--verde)}
.pill.verde::before{background:var(--verde-dot)}
.pill.rosso{background:var(--rosso-bg);color:var(--rosso)}
.pill.rosso::before{background:var(--rosso-dot)}
.pill.neutro{background:var(--velo);color:var(--tenue)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.dot.ambra{background:var(--ambra-dot)} .dot.blu{background:var(--corre-dot)} .dot.verde{background:var(--verde-dot)} .dot.rosso{background:var(--rosso-dot)} .dot.neutro{background:var(--spento)}

/* bottoni */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:22px;font-weight:700;font-size:14px;white-space:nowrap;transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .1s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--blu);color:#fff}
.btn.p:hover{background:var(--blu-scuro)}
.btn.s{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1px var(--bordo)}
.btn.s:hover{box-shadow:inset 0 0 0 1px #CFC7B7;background:#FDFCFA}
.btn.g{color:var(--tenue)}
.btn.g:hover{background:var(--velo);color:var(--ink)}
.btn.pic{min-height:36px;padding:0 14px;font-size:13px}
.btn kbd{font:inherit;font-size:11px;font-weight:700;opacity:.75;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.18)}
.link{color:var(--blu);font-weight:700}
.link:hover{color:var(--navy)}

/* home: la cosa di adesso */
.adesso{padding:26px 26px 22px;border-radius:20px;background:#fff;border:1px solid var(--bordo);position:relative}
.adesso .riga1{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.adesso h2{margin:0;font-size:26px;line-height:1.15;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.adesso .chi{color:var(--tenue);font-size:14px;font-weight:600;margin-top:4px}
.adesso .cosa{font-size:16px;margin:14px 0 0;color:var(--ink)}
.voceclara{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--corre-bg)}
.voceclara p{margin:0;font-size:14px;color:#1B3A63}
.voceclara b{color:var(--corre)}
.adesso .azioni{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.adesso .poi{margin-left:auto;font-size:13px;color:var(--tenue)}
.adesso .poi button{color:var(--navy);font-weight:700;min-height:32px}
.adesso .poi button:hover{text-decoration:underline}

/* traguardo */
.barra{display:flex;gap:4px;margin:4px 0 14px}
.barra i{flex:1;height:6px;border-radius:3px;background:var(--velo)}
.barra i.ok{background:var(--verde-dot)}
.trag{display:flex;align-items:center;gap:12px;min-height:40px;font-size:14px}
.spunta{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;border:2px solid var(--bordo)}
.spunta.ok{background:var(--verde-dot);border-color:var(--verde-dot);color:#fff}
.spunta svg{width:12px;height:12px}
.trag .q{margin-left:auto;color:var(--tenue);font-weight:700;font-size:13px}

/* righe */
.righe{display:flex;flex-direction:column}
.riga{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 4px;border-top:1px solid var(--velo);text-align:left;width:100%}
.riga:first-child{border-top:0}
.riga .ora{width:64px;flex-shrink:0;font-weight:800;color:var(--navy);font-size:14px}
.riga .corpo{flex:1;min-width:0}
.riga .t1{font-weight:700;color:var(--ink);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riga .t2{font-size:13px;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.riga:hover{background:#FCFBF8}
.vuoto{font-size:14px;color:var(--tenue);padding:6px 0}

.lato .carta.pad{padding:16px 18px}
.passaggio{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--velo)}
.passaggio:first-of-type{border-top:0}
.passaggio .t1{font-weight:700;font-size:13px}
.passaggio .t2{font-size:12px;color:var(--tenue)}
.corre{background:var(--corre-bg);border-color:transparent}
.corre .num3{display:flex;gap:18px;margin-top:6px}
.corre .num3 b{display:block;font-size:22px;font-weight:800;color:var(--navy)}
.corre .num3 span{font-size:12px;color:var(--tenue)}

/* posta */
.posta{flex:1;min-height:0;display:grid;grid-template-columns:360px minmax(0,1fr)}
.elenco{border-right:1px solid var(--bordo);overflow-y:auto;background:var(--avorio)}
.elenco .testa{padding:24px 20px 4px;margin:0}
.gruppo{padding:16px 12px 4px}
.gruppo .et-sez{padding:0 8px}
.conv{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;min-height:64px}
.conv:hover{background:var(--velo)}
.conv.on{background:#fff;box-shadow:0 0 0 1px var(--bordo)}
.conv .dot{margin-top:7px}
.conv .c{flex:1;min-width:0}
.conv .r1{display:flex;align-items:baseline;gap:8px}
.conv .n{font-weight:700;font-size:14px;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .q{font-size:12px;color:var(--tenue);font-weight:600;white-space:nowrap}
.conv .p{font-size:13px;color:var(--tenue);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.conv.fatta .n{color:var(--tenue);font-weight:600}

.filo{min-height:0;display:flex;flex-direction:column;background:#fff}
.filo-testa{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--velo);min-height:72px}
.filo-testa .indietro{display:none}
.filo-testa h2{margin:0;font-size:17px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filo-testa .sub{font-size:12px;color:var(--tenue);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filo-testa .dx{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.contatore{font-size:12px;color:var(--tenue);font-weight:700}
.bolle{flex:1;min-height:0;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(var(--avorio),var(--avorio))}
.bolla{max-width:min(560px,85%);padding:12px 15px;border-radius:18px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.bolla .q{display:block;font-size:11px;margin-top:6px;opacity:.7;text-align:right;font-weight:600}
.bolla.loro{align-self:flex-start;background:#fff;border:1px solid var(--bordo);border-bottom-left-radius:6px}
.bolla.noi{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:6px}
.bolla.all{display:flex;align-items:center;gap:10px;white-space:normal}
.bolla.all .doc{width:34px;height:40px;border-radius:6px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:10px;font-weight:800}
.sistema{align-self:center;font-size:12px;color:var(--tenue);font-weight:600;padding:4px 12px;border-radius:12px;background:var(--velo)}
.bozza{align-self:flex-end;max-width:min(600px,92%);width:100%;border:1.5px dashed #8DB5DD;background:#F2F7FC;border-radius:18px;border-bottom-right-radius:6px;padding:12px 15px}
.bozza .lab{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--corre);margin-bottom:8px}
.bozza .txt{white-space:pre-wrap;font-size:14px;line-height:1.6;color:var(--ink)}
.bozza textarea{width:100%;min-height:220px;border:1px solid #BCD3EA;border-radius:12px;padding:10px 12px;background:#fff;line-height:1.6;resize:vertical}
.bozza textarea:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 3px rgba(41,121,196,.15)}
.partita{align-self:flex-end;font-size:12px;font-weight:700;color:var(--corre);display:flex;align-items:center;gap:6px}
.telchip{display:inline-flex;align-items:center;gap:8px;margin-top:8px;min-height:40px;padding:0 14px;border-radius:20px;background:var(--velo);color:var(--navy);font-weight:700;font-size:13px;text-decoration:none}
.filo-piede{border-top:1px solid var(--velo);padding:12px 20px calc(12px + var(--safe));display:flex;align-items:center;gap:8px;background:#fff}
.filo-piede .dopo{font-size:12px;color:var(--tenue);font-weight:600;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.filo-piede .dopo b{color:var(--ink)}
.fine{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:6px}
.fine .cerchio{width:64px;height:64px;border-radius:50%;background:var(--verde-bg);color:var(--verde);display:grid;place-items:center;margin-bottom:10px}
.fine .cerchio svg{width:30px;height:30px}
.fine h2{margin:0;font-size:22px;font-weight:800;color:var(--navy)}
.fine p{margin:0;color:var(--tenue);max-width:380px}
.prossima{margin-top:22px;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:1px solid var(--bordo);background:#fff;text-align:left;max-width:440px;width:100%}
.prossima:hover{border-color:var(--blu)}

/* trattativa */
.colonne{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.colonna{background:var(--velo);border-radius:18px;padding:12px}
.colonna h3{margin:2px 6px 10px;font-size:13px;font-weight:800;color:var(--navy);display:flex;gap:8px;align-items:baseline}
.colonna h3 .tab{color:var(--tenue)}
.scheda-c{background:#fff;border:1px solid var(--bordo);border-radius:14px;padding:14px;margin-bottom:10px;transition:box-shadow .15s var(--ease)}
.scheda-c:hover{box-shadow:0 2px 10px rgba(28,46,110,.07)}
.scheda-c .apri{display:block;width:100%;text-align:left}
.scheda-c .n{font-size:15px;font-weight:800;color:var(--navy)}
.scheda-c .m{font-size:12px;color:var(--tenue);margin-top:1px}
.scheda-c .st{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:10px;color:var(--ink)}
.scheda-c .pie{display:flex;align-items:center;gap:8px;margin-top:12px}
.scheda-c .val{margin-left:auto;font-size:12px;color:var(--tenue);font-weight:700}
.segm{display:none}
.passati{margin-top:24px}
.passati .fila{display:flex;flex-wrap:wrap;gap:10px}
.mini{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:#fff;border:1px solid var(--bordo);min-height:52px;text-align:left}
.mini .t1{font-weight:700;font-size:13px}
.mini .t2{font-size:12px;color:var(--tenue)}

/* strato: scheda e fogli */
#strato{position:fixed;inset:0;z-index:50;display:none}
#strato.on{display:block}
.velo-scuro{position:absolute;inset:0;background:rgba(21,26,45,.28);animation:sfuma .18s var(--ease)}
.cassetto{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--avorio);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(21,26,45,.12);animation:entra .22s var(--ease)}
.cassetto-testa{display:flex;align-items:center;gap:10px;padding:14px 16px 10px 24px}
.cassetto-corpo{flex:1;min-height:0;overflow-y:auto;padding:4px 24px 24px}
.cassetto-piede{border-top:1px solid var(--bordo);background:#fff;padding:12px 20px calc(12px + var(--safe));display:flex;gap:8px;align-items:center;justify-content:flex-end}
.x{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--tenue)}
.x:hover{background:var(--velo);color:var(--ink)}
.sch h2{margin:0;font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.15}
.sch .meta{color:var(--tenue);font-weight:600;margin:4px 0 12px}
.blocco{margin-top:22px}
.dove{font-size:17px;line-height:1.55;margin:0;color:var(--ink)}
.allegato{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--bordo)}
.allegato .doc{width:36px;height:44px;border-radius:7px;background:var(--rosso-bg);color:var(--rosso);display:grid;place-items:center;font-size:10px;font-weight:800}
.numeri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.numeri div{background:#fff;border:1px solid var(--bordo);border-radius:14px;padding:12px 14px}
.numeri b{display:block;font-size:20px;font-weight:800;color:var(--navy);line-height:1.2}
.numeri span{font-size:12px;color:var(--tenue)}
.scomoda{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--ambra-bg);color:#5E3305;margin-bottom:8px;font-size:15px;font-weight:600}
.scomoda i{font-style:normal;width:24px;height:24px;border-radius:12px;background:#fff;color:var(--ambra);display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.appunti{width:100%;min-height:110px;border:1px solid var(--bordo);border-radius:14px;padding:12px 14px;background:#fff;resize:vertical;line-height:1.55}
.appunti:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 3px rgba(41,121,196,.15)}
.foglio{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 64px);overflow-y:auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 20px 60px rgba(21,26,45,.22);animation:sale .2s var(--ease)}
.foglio h3{margin:0;font-size:20px;font-weight:800;color:var(--navy)}
.foglio h3.et-sez{font-size:11px;color:var(--tenue);font-weight:700}
.foglio .sub{color:var(--tenue);margin:4px 0 16px}
.pacco{border:1px solid var(--bordo);border-radius:14px;padding:14px 16px;background:var(--avorio);font-size:14px}
.pacco p{margin:0 0 8px}
.pacco p:last-child{margin:0}
.pacco b{color:var(--navy)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:20px;box-shadow:inset 0 0 0 1px var(--bordo);font-weight:600;font-size:13px;background:#fff}
.chip.on{background:var(--navy);color:#fff;box-shadow:none}
.campo{width:100%;min-height:44px;border:1px solid var(--bordo);border-radius:12px;padding:10px 12px;background:#fff}

.scelta .t1{font-weight:800;color:var(--navy)}
.scelta .t2{font-size:13px;color:var(--tenue)}
.scelta.prima{border-color:var(--blu);box-shadow:0 0 0 1px var(--blu)}

/* clara */
.vclara{flex:1;min-height:0;display:flex;flex-direction:column;background:#EFEAE0}
.clara-testa{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--bordo);min-height:64px}
.clara-testa .av{width:40px;height:40px;font-size:15px}
.clara-testa b{font-size:16px;color:var(--navy);font-weight:800;display:block}
.clara-testa .stato{font-size:12px;color:var(--verde);font-weight:600}
.chat{flex:1;min-height:0;overflow-y:auto;padding:20px 16px}
.chat-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.giorno{align-self:center;font-size:12px;font-weight:700;color:var(--tenue);background:rgba(255,255,255,.7);padding:4px 12px;border-radius:10px;margin:8px 0}
.msg{max-width:min(520px,86%);padding:10px 14px 8px;border-radius:18px;font-size:15px;line-height:1.5;background:#fff;align-self:flex-start;border-top-left-radius:6px;box-shadow:0 1px 1px rgba(21,26,45,.06);animation:sale .2s var(--ease)}
.msg.io{align-self:flex-end;background:#DCE9F7;border-top-left-radius:18px;border-top-right-radius:6px}
.msg .ora{display:block;text-align:right;font-size:11px;color:var(--spento);margin-top:2px;font-weight:600}
.msg .mail{margin:8px 0 4px;padding:10px 12px;border-left:3px solid var(--blu);background:#F4F8FC;border-radius:8px;font-size:13px;white-space:pre-wrap;color:var(--ink);line-height:1.55}
.msg .mail .a{display:block;font-size:11px;font-weight:700;color:var(--corre);margin-bottom:4px;white-space:normal}

.msg .bott .btn{min-height:40px;padding:0 14px;font-size:13px}
.msg .fatto{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:700;color:var(--verde)}

.scrive{align-self:flex-start;background:#fff;border-radius:18px;padding:12px 16px;display:flex;gap:4px}

.scrivi{display:flex;gap:8px;align-items:flex-end;padding:10px 16px calc(12px + var(--safe));max-width:792px;margin:0 auto;width:100%}
.scrivi textarea{flex:1;min-height:46px;max-height:140px;border:0;border-radius:23px;padding:12px 18px;background:#fff;resize:none;line-height:1.4;box-shadow:0 1px 1px rgba(21,26,45,.06)}
.scrivi textarea:focus{outline:none;box-shadow:0 0 0 2px var(--blu)}
.manda{width:46px;height:46px;border-radius:23px;background:var(--blu);color:#fff;display:grid;place-items:center;flex-shrink:0}

/* pallina di clara */
#pallina{position:fixed;right:24px;bottom:24px;z-index:40;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 18px 6px 6px;border-radius:26px;background:#fff;border:1px solid var(--bordo);box-shadow:0 8px 30px rgba(21,26,45,.12);max-width:360px;text-align:left}

#pallina[hidden]{display:none}
#pallina .av{width:40px;height:40px;font-size:15px}

/* tabelle di giacomo */
.soldi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.soldi div{background:#fff;border:1px solid var(--bordo);border-radius:14px;padding:14px 16px}
.soldi b{display:block;font-size:22px;font-weight:800;color:var(--navy)}

.densa td{padding:0 12px;height:46px;border-bottom:1px solid var(--velo);vertical-align:middle}
.densa tr:last-child td{border-bottom:0}
.densa tbody tr:hover{background:#FCFBF8;cursor:pointer}
.densa .n{font-weight:700;color:var(--ink)}
.densa .m{font-size:12px;color:var(--tenue)}
.densa td.num{text-align:right;font-weight:700}
.densa th.num{text-align:right}
.chi{display:inline-flex;align-items:center;gap:6px;font-weight:600}

/* lorenzo */
.quattro{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}

.quattro span{font-size:13px;color:var(--tenue);font-weight:600}

.quattro .att b{color:var(--ambra)}

/* toast */
#toast{position:fixed;left:256px;bottom:24px;transform:translateY(20px);z-index:80;opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;padding:10px 10px 10px 18px;border-radius:16px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);width:max-content;box-shadow:0 10px 30px rgba(21,26,45,.25);transition:opacity .2s var(--ease),transform .2s var(--ease)}
#toast.on{opacity:1;transform:none;pointer-events:auto}

@keyframes entra{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes sale{from{transform:translate(-50%,calc(-50% + 12px));opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
.msg{animation-name:salemsg}
@keyframes salemsg{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@keyframes sfuma{from{opacity:0}to{opacity:1}}
@keyframes pulsa{0%,100%{opacity:.3}50%{opacity:1}}

<script>
(function(){
'use strict';
const L = window.LAB;
const OGGI = new Date(L.oggi + 'T12:00:00');
const AZ = {}; L.aziende.forEach(a => { AZ[a.id] = Object.assign({}, a); });
const P = {}; L.squadra.forEach(p => { P[p.id] = p; });

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const giorni = iso => Math.round((OGGI - new Date(iso + 'T12:00:00')) / 864e5);
const dm = iso => { const d = new Date(iso + 'T12:00:00'); return d.getDate() + '/' + (d.getMonth() + 1); };

const TAPPA = { risposta:'Risposta', analisi:'Analisi', follow_up:'Follow-up', conoscitiva:'Conoscitiva', tecnica:'Tecnica', avvio:'Avvio', prova:'Prova', cliente:'Cliente' };

/* icone */
const I = {

  manda:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  tel:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/></svg>',

};
const av = (id, cls) => { const p = P[id]; return `<span class="av ${cls||''} ${id==='clara'?'clara':''}" style="background:${p.colore}" aria-hidden="true">${esc(p.nome[0])}</span>`; };

/* ---------- la posta: risposte e fila dei follow-up, un'unica coda ---------- */
const POSTA = [];
L.conversazioni.forEach(c => POSTA.push({ id:c.id, tipo:'risposta', az:c.azienda, aspetta:c.aspetta, perche:c.perche, filo:c.filo, bozza:c.bozza }));
L.seguiti.forEach(s => {
  const a = AZ[s.azienda];
  POSTA.push({ id:s.id, tipo:'seguito', az:s.azienda, aspetta:'pronto', perche:s.perche, giorno:s.giorno, bozza:s.bozza,
    filo:[{ chi:'noi', quando:dm(a.ultima), testo:'Analisi su ' + a.nome, allegato:true }] });
});
const CLARA_DICE = {
  c1:'Il prezzo per mail non lo do: gli lascio l’analisi e propongo la call di giovedì alle 15.',
  c2:'Ha lasciato il numero e preferisce il telefono. Lo chiami tu, o gli scrivo io un orario?',
  s1:'Silenzio dal 12/9. Riparto dall’autunno dei cantieri e propongo giovedì 8 alle 15.',

  tasks: L.task.map(t => Object.assign({}, t)),

};

const posta = id => POSTA.find(x => x.id === id);
const postaPer = azId => POSTA.find(x => x.az === azId && !S.fatte[x.id]);
const bozzaDi = it => S.testi[it.id] != null ? S.testi[it.id] : (it.bozza || S.extraBozze[it.id] || null);

/* ---------- clara: un filo solo per persona ---------- */
const CHAT = {
  dre:[
    { g:'Ieri' },
    { id:'d0', ora:'18:40', testo:'Giornata chiusa: 3 follow-up partiti, nessun sì senza analisi. Buona serata.' },
    { g:'Oggi' },
    { id:'d1', ora:'8:02', testo:'Buongiorno Dre. Stanotte ho letto 6 risposte: 4 le ho chiuse io, 2 aspettano te. Poi ci sono 2 follow-up pronti e alle 15 la call con Ferramenta Bassi.', azioni:[{ t:'Iniziamo', go:'posta/c1', p:1 }] },
    { id:'d2', ora:'9:14', ref:'c1', testo:'Officina Moretti chiede subito quanto costa. Per mail il prezzo non lo do: gli lascio l’analisi e propongo la call di giovedì alle 15. Te la lascio così:' },
    { id:'d3', ora:'10:30', ref:'c2', testo:'Edilnova ha lasciato il numero: preferisce il telefono. Lo chiami tu, o gli scrivo io un orario?' },
    { id:'d4', ora:'11:05', ref:'t1', testo:'Impianti Solari Nord è da ieri sulla scrivania di Carlo e non l’ha ancora preso. Glielo ricordo io?' },
    { id:'d5', ora:'12:10', ref:'a1', testo:'Alle 15 Ferramenta Bassi, con Giulia. Ha letto l’analisi. Le due cose scomode: pochi prezzi sul sito e le catene. La scheda per la call è pronta.' }
  ],

/* esito di un riferimento: se c'e', i bottoni lasciano il posto a una riga verde */
function esitoRef(ref){
  if (!ref) return null;
  if (S.fatte[ref]) return { approvata:'Approvata, parte da Smartlead', chiamo:'La chiami tu: numero a portata, te lo ricordo alle 17', lasciata:'Lasciata andare' }[S.fatte[ref]];
  const t = S.tasks.find(x => x.id === ref);
  if (t){
    if (t.stato === 'accettata') return t.a === S.chi ? 'Preso. Dre lo vede.' : P[t.a].nome + ' l’ha preso';
    if (t.stato === 'fatto') return 'Fatto';
    if (S.ricordati[ref]) return 'Ricordato a ' + P[S.chi === t.a ? t.da : t.a].nome;
    if (t.bozzaPronta) return 'Bozza pronta nei tuoi file';
  }
  return null;
}
function azioniRef(m){
  const r = m.ref;
  if (r && posta(r)){
    const it = posta(r);
    if (it.bozza || S.extraBozze[r]) return [{ t:'Approva', a:'approva:' + r, p:1 }, { t:'Apri nella Posta', go:'posta/' + r }];
    return [{ t:'Lo chiamo io', a:'chiamo:' + r, p:1 }, { t:'Scrivigli tu', a:'mail:' + r }];
  }
  if (r === 't1') return S.chi === 'carlo' ? [{ t:'Prendo io', a:'prendi:t1', p:1 }, { t:'Apri la scheda', go:'scheda/a7' }] : [{ t:'Sì, ricordaglielo', a:'ricorda:t1', p:1 }, { t:'Lascia stare', a:'zitta:' + m.id }];
  if (r === 't3') return S.chi === 'alex' ? [{ t:'Sì, scrivile tu', a:'chiedi:t3', p:1 }, { t:'Fatto, li ho', a:'fatto:t3' }] : S.chi === 'carlo' ? [{ t:'Sollecita Alex', a:'ricorda:t3', p:1 }] : [{ t:'Ricordalo ad Alex', a:'ricorda:t3', p:1 }];
  if (r === 't2') return [{ t:'Sì, la bozza', a:'bozza:t2', p:1 }, { t:'Fatto, l’ho mandato', a:'fatto:t2' }];

  if (r && r.startsWith('pas:')) return [{ t:'Prendo io', a:'prendi:' + r.slice(4), p:1 }];

function go(path){
  const [v, x] = path.split('/');
  if (v === 'scheda'){ S.scheda = x; S.viste[x] = true; S.foglio = null; render(); return; }
  S.scheda = null; S.foglio = null;

/* ---------- toast ---------- */
let toastFn = null, toastT = null;
function toast(testo, azione){
  const el = document.getElementById('toast');
  toastFn = azione ? azione.fn : null;
  el.innerHTML = `<span>${esc(testo)}</span>${azione ? `<button data-act="toast">${esc(azione.t)}</button>` : ''}`;
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), azione ? 6500 : 3200);
}

/* ---------- azioni ---------- */
function approva(id, resta){
  const it = posta(id); if (!it) return;

  S.fatte[id] = 'approvata'; S.modifica[id] = false;
  const nome = AZ[it.az].nome;
  const prossima = prossimaDopo(id);
  if (!resta) S.aperta = prossima ? prossima.id : 'fine';
  if (S.vista === 'posta' && !resta) go('posta/' + S.aperta); else render();
  toast(nome + ': approvata, parte da Smartlead a nome di Lorenzo.', { t:'Annulla', fn:() => { delete S.fatte[id]; if (S.vista === 'posta') go('posta/' + id); else render(); toast('Annullata: la bozza è tornata nella Posta.'); } });
}
function prossimaDopo(id){
  const i = POSTA.findIndex(x => x.id === id);

  return resto.find(x => POSTA.indexOf(x) > i) || resto[0] || null;
}

  const it = posta(id);
  S.fatte[id] = come;
  const prossima = prossimaDopo(id);
  if (S.vista === 'posta') go('posta/' + (prossima ? prossima.id : 'fine')); else render();

}

function rispostaClara(testo){

  }

function azione(a, el){
  const [k, v] = a.split(':');

    case 'striscia': document.getElementById('striscia').remove(); return;

    case 'chiedi': S.ricordati[v] = true; claraDice('Scritto a Elena Ferri di Palestra Forma: le ho chiesto di aggiungere Studio Galilei come gestore dell’account. Quando risponde, te lo dico subito.'); render(); scrollChat(); return;
    case 'fatto': { const t = S.tasks.find(x => x.id === v); t.stato = 'fatto'; if (S.vista === 'clara') { claraDice('Perfetto, lo dico a ' + P[t.da].nome + '.'); } render(); scrollChat(); toast('Fatto. ' + P[t.da].nome + ' lo vede adesso.'); } return;
    case 'bozza': { const t = S.tasks.find(x => x.id === v); t.bozzaPronta = true; claraDice('Eccola. Settembre: 4.120 visite dalle campagne, 61 richieste, costo per richiesta 9,80 €, meglio di agosto del 14%. Ti ho lasciato tre righe di commento da sistemare a modo tuo.', [{ t:'Fatto, l’ho mandato', a:'fatto:t2', p:1 }]); render(); scrollChat(); } return;
    case 'numeri': claraDice('Fatto: dentisti a Verona, 5.200 ricerche al mese, il clic sta sui 2,10 €. Te li ho messi nella scheda di Studio Dentistico Riva.'); el.closest('.msg') && (CHAT[S.chi].find(m => m.id === 'k3').azioni = [{ t:'Apri la scheda', go:'scheda/a2' }]); render(); scrollChat(); return;
    case 'fattura': claraDice('Pronta in bozza, 1.400 € per il primo mese di prova. La trovi fra le fatture da controllare: parte solo quando dici tu.'); CHAT.giacomo.find(m => m.id === 'q3').azioni = []; render(); scrollChat(); return;
    case 'zitta': { const m = CHAT[S.chi].find(x => x.id === v); if (m) m.zitta = true; render(); } return;
    case 'passa': S.foglio = { tipo:'passa', az:v }; S.passaEntro = 'domani'; render(); setTimeout(() => { const b = document.querySelector('.foglio .btn.p'); if (b) b.focus(); }, 30); return;

      delete S.fatte.n1;

    } return;

  }
}

        <button class="riga" data-go="scheda/a2"><span class="ora tab">Gio 8</span><span class="corpo"><span class="t1" style="display:block">Studio Dentistico Riva</span><span class="t2" style="display:block">Call tecnica con Dre, 15:30</span></span><span class="pill blu">con Dre</span></button>

      <aside class="col lato">
        <section class="carta pad"><h3 class="et-sez">In ritardo</h3>
          ${t3.stato === 'fatto' ? '<p class="vuoto">Niente. Alex ha chiuso gli accessi.</p>' : `<div class="passaggio">${av('alex','s')}<div style="flex:1"><div class="t1">Accessi Google Ads, Palestra Forma</div><div class="t2">ad Alex, scadeva ieri</div></div></div>

}
function vOggiGiacomo(){
  const k = S.ordina.k, d = S.ordina.dir;
  const ord = Object.keys(TAPPA);
  const righe = L.aziende.map(x => AZ[x.id]).filter(a => !a.perso).map(a => ({ a, s:statoAz(a), chi:chiCeLha(a) }));
  const val = r => ({ azienda:r.a.nome, tappa:ord.indexOf(r.a.tappa), chi:P[r.chi].nome, valore:r.a.valore, ultima:-giorni(r.a.ultima) })[k];
  righe.sort((x, y) => (val(x) > val(y) ? 1 : val(x) < val(y) ? -1 : 0) * d);
  const th = (key, t, cls) => `<th class="${cls||''}" aria-sort="${k===key ? (d>0?'ascending':'descending') : 'none'}"><button data-act="ordina:${key}">${t}${k===key ? (d>0?' ↑':' ↓') : ''}</button></th>`;

      ${righe.map(r => `<tr data-go="scheda/${r.a.id}" tabindex="0"><td><div class="n">${esc(r.a.nome)}</div><div class="m">${esc(r.a.citta)}</div></td><td><span class="pill neutro" style="padding:0 8px">${esc(TAPPA[r.a.tappa])}</span></td><td class="nasc"><span class="chi">${av(r.chi,'s')}${esc(P[r.chi].nome)}</span></td><td><span class="chi" style="font-weight:500"><span class="dot ${r.s.c}"></span>${esc(r.s.t)}</span></td><td class="nasc tab">${dm(r.a.ultima)}</td><td class="num tab">${r.a.valore ? euro(r.a.valore) : '<span style="color:var(--spento)">0</span>'}</td></tr>`).join('')}

    <h3 class="et-sez">Chi fa cosa</h3>
    <section class="carta" style="padding:6px 8px"><table class="densa"><thead><tr><th>Cosa</th><th>Da</th><th>A</th><th>Entro</th><th>Stato</th></tr></thead><tbody>
      ${S.tasks.map(t => `<tr data-go="scheda/${t.azienda}" tabindex="0"><td><div class="n" style="font-weight:600">${esc(t.titolo)}</div></td><td class="nasc"><span class="chi">${av(t.da,'s')}${esc(P[t.da].nome)}</span></td><td><span class="chi">${av(t.a,'s')}${esc(P[t.a].nome)}</span></td><td class="nasc">${esc(t.scadenza)}</td><td>${pillTask(t)}</td></tr>`).join('')}
    </tbody></table></section>
  </div></div>`;
}

/* ---------- la scheda per la call e i fogli ---------- */
function renderStrato(){
  const s = document.getElementById('strato');
  if (!S.scheda && !S.foglio){ s.className = ''; s.innerHTML = ''; document.body.classList.remove('strato-on'); return; }
  s.className = 'on';
  document.body.classList.add('strato-on');
  let h = '';
  if (S.scheda) h += `<div class="velo-scuro" data-act="chiudi-scheda"></div>` + vScheda(AZ[S.scheda]);
  if (S.foglio) h += `<div class="velo-scuro" data-act="chiudi-foglio"></div>` + vFoglio();
  s.innerHTML = h;
}
function vScheda(a){
  const s = statoAz(a);
  const call = L.call.find(k => k.azienda === a.id);
  const it = postaPer(a.id);
  let piede = '';
  if (a.id === 'a1' && a.tappa === 'conoscitiva') piede = `<button class="btn s" data-act="analisi">Apri l’analisi</button><button class="btn p" data-act="esito:a1">Com’è andata?</button>`;
  else if (a.tappa === 'tecnica' && !a.passato && !it && S.chi === 'dre') piede = `<button class="btn s" data-act="analisi">Il preventivo</button><button class="btn p" data-act="passa:${a.id}">Passa a Carlo</button>`;
  else if (it) piede = `<button class="btn p" data-go="posta/${it.id}">${it.bozza || S.extraBozze[it.id] ? 'Leggi la bozza' : 'Decidi'}</button>`;
  const scom = a.scomode.length ? `<div class="blocco"><h3 class="et-sez">${a.scomode.length === 2 ? 'Le due cose scomode' : 'Da tenere a mente'}</h3>${a.scomode.map((x, i) => `<div class="scomoda"><i>${i + 1}</i><span>${esc(x)}</span></div>`).join('')}</div>` : '';
  return `<aside class="cassetto" role="dialog" aria-modal="true" aria-label="Scheda di ${esc(a.nome)}">
    <div class="cassetto-testa"><span class="pill ${s.c}">${esc(call ? call.tipo + ' ' + call.quando : TAPPA[a.tappa])}</span><button class="x" style="margin-left:auto" data-act="chiudi-scheda" aria-label="Chiudi">${I.x}</button></div>
    <div class="cassetto-corpo sch">
      <h2>${esc(a.nome)}</h2>
      <div class="meta">${esc(a.persona)}, ${esc(a.citta)}, ${esc(a.settore)}</div>
      <div class="blocco" style="margin-top:12px"><h3 class="et-sez">Dove eravamo</h3><p class="dove">${esc(a.dove)}</p></div>
      <div class="blocco"><h3 class="et-sez">Cosa ha in mano</h3><button class="allegato" style="width:100%;text-align:left" data-act="analisi"><span class="doc">PDF</span><span style="flex:1"><b style="display:block;color:var(--navy)">${esc(a.cosaHa)}</b><span style="font-size:13px;color:var(--tenue)">la stessa copia che ha ricevuto</span></span><span class="link">Apri</span></button></div>
      <div class="blocco"><h3 class="et-sez">Il suo mercato</h3><div class="numeri">
        <div><b class="tab">${mig(a.domanda)}</b><span>ricerche al mese</span></div>
        <div><b class="tab">${a.cpc.toFixed(2).replace('.', ',')} €</b><span>a clic</span></div>
        <div><b class="tab" style="font-size:17px">${esc(a.ticket)}</b><span>vale un cliente</span></div></div>
        <p style="margin:10px 0 0;font-size:13px;color:var(--tenue)">Fa per noi: <b style="color:${a.fit === 'SI' ? 'var(--verde)' : 'var(--ambra)'}">${a.fit === 'SI' ? 'sì' : 'forse'}</b></p></div>
      ${scom}
      ${call ? `<div class="blocco"><h3 class="et-sez">Appunti della call</h3><textarea class="appunti" data-appunti="${a.id}" aria-label="Appunti della call">${esc(S.appunti[a.id] || '')}</textarea></div>` : ''}
    </div>
    ${piede ? `<div class="cassetto-piede">${piede}</div>` : ''}
  </aside>`;
}
function vFoglio(){
  const f = S.foglio; const a = AZ[f.az];
  if (f.tipo === 'passa'){
    return `<div class="foglio" role="dialog" aria-modal="true" aria-label="Passa a Carlo">
      <div style="display:flex;align-items:center;gap:12px">${av('carlo')}<div><h3>Passa ${esc(a.nome)} a Carlo</h3><div class="sub" style="margin:0">Diventa suo, e lo vede subito in cima alla giornata.</div></div></div>
      <div class="pacco" style="margin-top:16px"><p><b>Carlo riceve.</b> ${esc(a.dove)}</p><p><b>In mano al cliente.</b> ${esc(a.cosaHa)}</p>${a.scomode.length ? `<p><b>Da tenere a mente.</b> ${esc(a.scomode.join('; '))}</p>` : ''}</div>
      <h3 class="et-sez" style="margin-top:18px">Due righe per Carlo, se vuoi</h3>
      <textarea class="campo" rows="2" data-nota aria-label="Due righe per Carlo">${esc(S.passaNota)}</textarea>
      <h3 class="et-sez" style="margin-top:16px">Lo prende entro</h3>
      <div class="chips">${['oggi','domani','venerdì'].map(x => `<button class="chip ${S.passaEntro===x?'on':''}" data-act="entro:${x}">${x[0].toUpperCase() + x.slice(1)}</button>`).join('')}</div>
      <div class="azioni"><button class="btn g" data-act="chiudi-foglio">Annulla</button><button class="btn p" data-act="conferma-passa:${a.id}">Passa a Carlo</button></div>
    </div>`;
  }
  return `<div class="foglio" role="dialog" aria-modal="true" aria-label="Com’è andata">
    <h3>Com’è andata con ${esc(a.persona.split(' ')[0])}?</h3><div class="sub">Scegli, al resto pensa Clara.</div>
    <button class="scelta prima" data-act="tecnica"><span style="flex:1"><span class="t1" style="display:block">Bene: fissa la tecnica con Carlo</span><span class="t2">Clara scrive l’invito per giovedì 8 alle 11, Carlo è libero</span></span></button>
    <button class="scelta" data-act="pensa"><span style="flex:1"><span class="t1" style="display:block">Ci pensa</span><span class="t2">Il follow-up fra una settimana, lo prepara Clara</span></span></button>
    <button class="scelta" data-act="nofa:${a.id}"><span style="flex:1"><span class="t1" style="display:block">Non fa per noi</span><span class="t2">Esce dalla trattativa, resta recuperabile</span></span></button>
    <div class="azioni"><button class="btn g" data-act="chiudi-foglio">Non ancora</button></div>
  </div>`;
}

/* ---------- eventi ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-act]');
  if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.dataset.act){
    const a = el.dataset.act;
    if (a.startsWith('zitta-no:')){ const m = CHAT[S.chi].find(x => x.id === a.slice(9)); if (m) m.zitta = false; render(); return; }
    azione(a, el); return;
  }
  go(el.dataset.go);
});
document.addEventListener('change', e => {
  if (e.target.matches('select[data-chi]')) cambiaChi(e.target.value);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.testo) S.testi[t.dataset.testo] = t.value;
  if (t.dataset.appunti) S.appunti[t.dataset.appunti] = t.value;
  if (t.hasAttribute('data-nota')) S.passaNota = t.value;
  if (t.id === 'scrivi'){ t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px'; }
});
document.addEventListener('keydown', e => {
  const tgt = e.target;
  const scrive = tgt.tagName === 'TEXTAREA' || tgt.tagName === 'INPUT';
  if (tgt.id === 'scrivi' && e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); azione('manda'); return; }
  if (e.key === 'Escape'){
    if (scrive){ tgt.blur(); return; }
    if (S.foglio){ S.foglio = null; render(); return; }
    if (S.scheda){ S.scheda = null; render(); return; }
  }
  if (tgt.matches && tgt.matches('tr[data-go]') && e.key === 'Enter'){ go(tgt.dataset.go); return; }
  if (S.vista === 'posta' && !S.scheda && !S.foglio){
    const cur = S.aperta || (daFare()[0] && daFare()[0].id);
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && cur && posta(cur) && !S.fatte[cur] && bozzaDi(posta(cur))){ e.preventDefault(); approva(cur); return; }
    if (!scrive && (e.key === 'j' || e.key === 'k')){
      const l = daFare(); const i = l.findIndex(x => x.id === cur);
      const n = l[e.key === 'j' ? Math.min(l.length - 1, i + 1) : Math.max(0, i - 1)];
      if (n) go('posta/' + n.id);
    }
  }
});
let largo = desk();
window.addEventListener('resize', () => { if (desk() !== largo){ largo = desk(); render(); } });
render();
})();
</script>
