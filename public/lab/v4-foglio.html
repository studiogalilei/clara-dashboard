<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V4, il foglio | Studio Galilei</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231C2E6E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1C2E6E; --blu:#2979C4; --avorio:#FAF8F4; --ink:#16203A; --mut:#667085;
  --line:#EEEAE2; --line2:#E2DCD0; --ambra:#F5B200; --verde:#15803D; --rosso:#DC2626;
  --selbg:#EDF4FC; --hover:#FBFAF6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;font-size:13px;color:var(--ink);background:var(--avorio);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
.mut{color:var(--mut)}
.ph{color:#B8BDC7;font-weight:500}
[hidden]{display:none!important}
kbd{font:700 10px/1 'Plus Jakarta Sans',sans-serif;padding:3px 5px;border:1px solid #D9D3C7;border-bottom-width:2px;border-radius:4px;background:#fff;color:#4B5563}

#app{display:flex;flex-direction:column;height:100dvh}

/* striscia */
.banner{display:flex;align-items:center;gap:10px;height:28px;padding:0 10px 0 20px;background:var(--navy);color:#E6ECF8;font-size:11.5px;font-weight:600;flex:none}
.banner .sp{flex:1}
.banner button{color:#C3CFEA;font-size:11.5px;font-weight:600;height:22px;padding:0 8px;border-radius:6px}
.banner button:hover{background:rgba(255,255,255,.12);color:#fff}

/* barra in alto */
.top{display:flex;align-items:center;gap:14px;height:52px;padding:0 16px 0 20px;background:#fff;border-bottom:1px solid var(--line2);flex:none}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--navy);font-size:14px;letter-spacing:-.01em;white-space:nowrap}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;display:grid;place-items:center;font-style:normal;font-size:10.5px;letter-spacing:.03em}
.tabs{display:flex;align-items:stretch;height:100%;margin-left:10px}
.tab{display:flex;align-items:center;gap:7px;padding:0 13px;font-weight:650;color:#5B6475;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--navy)}
.tab.on{color:var(--navy);border-color:var(--navy)}
.bd{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ambra);color:#2A1F00;font-size:10.5px;font-weight:800;display:inline-grid;place-items:center}
.bd.z{background:#EEEAE2;color:#8A8F99}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:7px;height:32px;width:220px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--avorio);color:var(--mut)}
.search:focus-within{border-color:var(--blu);background:#fff}
.search input{border:0;outline:0;background:none;width:100%;font-size:12.5px;color:var(--ink)}
.comeb{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 6px;border:1px solid var(--line2);border-radius:9px;background:#fff;font-size:12.5px;white-space:nowrap}
.comeb:hover{border-color:#CFC7B8}
.comeb .lab{color:var(--mut)}

/* titolo della vista */
.head{display:flex;align-items:center;gap:20px;padding:14px 20px 12px;flex:none}
.hl{flex:1;min-width:0}
.hl-k{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#946800;display:flex;align-items:center;gap:6px}
.hl-k.blu{color:var(--blu)} .hl-k.verde{color:var(--verde)}
.hl-k i{width:7px;height:7px;border-radius:50%;background:currentColor}
.hl-row{display:flex;align-items:center;gap:12px;margin-top:3px;min-width:0}
.hl-t{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hl-s{font-size:12.5px;color:#5B6475;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line2);background:#fff;font-weight:700;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:#CFC7B8}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:#25398A}
.btn.ok{background:var(--verde);border-color:var(--verde);color:#fff}
.btn kbd{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.kpis{display:flex;gap:6px;flex:none}
.kpi{display:flex;flex-direction:column;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:92px;text-align:left}
button.kpi:hover{border-color:#CFC7B8}
button.kpi.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.kpi b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.2}
.kpi span{font-size:10.5px;color:var(--mut);font-weight:650;white-space:nowrap}
.kpi.ambra b{color:#A87400} .kpi.verde b{color:var(--verde)} .kpi.rosso b{color:var(--rosso)} .kpi.blu b{color:var(--blu)}

/* il foglio */
.main{flex:1;display:flex;min-height:0;padding:0 20px;gap:12px}
.sheetw{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line2);border-bottom:0;border-radius:12px 12px 0 0;overflow:hidden}
.fx{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-bottom:1px solid var(--line);font-size:12.5px;background:#FDFCF9;flex:none}
.fx-ref{font-size:11px;font-weight:800;color:var(--navy);background:#EEF2FA;border-radius:6px;padding:4px 8px;white-space:nowrap}
.fx-v{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#374151}
.fx-h{font-size:11px;color:var(--mut);white-space:nowrap}
.fx.bulk{background:#F2F7FD}
.fx.bulk b{color:var(--navy)}
.mini{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--line2);background:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.mini:hover{border-color:#C9C1B2}
.mini.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.mini.ghost{border-color:transparent;background:none;color:var(--mut)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
.fchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 10px;border-radius:999px;background:#EEF2FA;color:var(--navy);font-size:11.5px;font-weight:700}
.fchip button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.fchip button:hover{background:#DCE4F4}
.scroll{flex:1;overflow:auto;position:relative;outline:none}

table.grid{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;min-width:900px}
.grid th{position:sticky;top:0;z-index:2;background:#F7F5F0;height:32px;text-align:left;font-size:11.5px;font-weight:700;color:#5B6475;padding:0 6px 0 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.grid th .thb{display:flex;align-items:center;gap:4px;width:100%;height:32px;text-align:left;font-weight:700;color:inherit}
.grid th .thb span{overflow:hidden;text-overflow:ellipsis}
.grid th .thm{margin-left:auto;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:#9AA1AE;opacity:0}
.grid th:hover .thm,.grid th .thm.on{opacity:1}
.grid th .thm.on{color:var(--blu);background:#E3EEFA}
.grid th .thm:hover{background:#ECE8DF}
.grid th.num .thb{justify-content:flex-end}
.grid th.num .thm{margin-left:0}
.grid th.rn,.grid td.rn{width:44px;padding:0;text-align:center}
.grid td{height:38px;padding:0 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff;scroll-margin-top:34px;scroll-margin-left:44px}
.grid td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.grid tr.row:hover td{background:var(--hover)}
.grid tr.row.sel td{background:var(--selbg)}
.grid td.ed{cursor:cell}
.grid td.c.act{box-shadow:inset 0 0 0 2px var(--blu);background:#fff}
.grid tr.row.sel td.c.act{background:#F7FAFE}
.grid td.rn{color:#A3A9B5;font-size:11px;font-variant-numeric:tabular-nums;box-shadow:inset 3px 0 0 var(--sem,transparent);position:relative}
.rn .nn{display:inline}
.rn input{display:none;width:15px;height:15px;margin:0;accent-color:var(--blu);cursor:pointer}
tr.row:hover .rn .nn,tr.row.sel .rn .nn{display:none}
tr.row:hover .rn input,tr.row.sel .rn input{display:inline-block}
.grid th.rn input{width:15px;height:15px;margin:0;accent-color:var(--blu);cursor:pointer}
.grid tr.grp td{height:34px;padding:12px 12px 0 14px;background:#fff;font-size:11.5px;font-weight:800;color:#3B4252;letter-spacing:.01em;border-bottom:1px solid var(--line2)}
.gdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.gn{color:#9AA1AE;font-weight:700;margin-left:6px}
.gnota{color:var(--mut);font-weight:500;margin-left:12px}
.grid tr.vuota td{color:#9AA1AE;font-style:normal;height:34px;padding-left:58px}
.grid tfoot td{position:sticky;bottom:0;background:#F7F5F0;border-top:1px solid var(--line2);border-bottom:0;font-weight:800;height:34px}
.grid td.editing{padding:0;box-shadow:inset 0 0 0 2px var(--blu)}
.cin{width:100%;height:100%;border:0;outline:0;padding:0 10px;background:#fff;font-size:13px}
.cin.num{text-align:right}
.nuova{width:100%;height:36px;border:0;outline:0;background:none;padding:0 10px;font-size:13px}
.nuova::placeholder{color:#A3A9B5}

.azl{font-weight:700;color:var(--ink);text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.azl:hover{color:var(--blu);text-decoration:underline;text-underline-offset:3px}

.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--cb);font-size:12px;font-weight:650;color:#1F2937;background:#fff;white-space:nowrap;vertical-align:middle}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.pers{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;vertical-align:middle}
.av{width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font-size:10px;font-weight:800;display:inline-grid;place-items:center;flex:none}
.caret{color:#B5BBC6;margin-left:4px;display:none;vertical-align:middle}
td.ed:hover .caret,td.act .caret{display:inline-block}
.prog{display:flex;align-items:center;gap:8px}
.prog .bar{flex:1;height:6px;border-radius:3px;background:#EEEAE2;overflow:hidden;max-width:70px}
.prog .bar i{display:block;height:100%;background:#0D9488;border-radius:3px}
.prog span{font-size:12px;font-weight:650;color:#374151}

/* Clara nella cella */
.cl{display:flex;align-items:center;gap:8px;min-width:0;width:100%}
.cl-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.spark{color:var(--blu);display:flex;flex:none}
.cl-b{display:flex;gap:4px;flex:none}
.cbtn{height:26px;min-width:26px;border-radius:7px;display:inline-grid;place-items:center;border:1px solid var(--line2);background:#fff;color:#4B5563;font-size:12px;font-weight:700}
.cbtn.si:hover{background:var(--verde);border-color:var(--verde);color:#fff}
.cbtn.no:hover{background:#F2F0EB;color:var(--rosso)}
.cbtn.pri{padding:0 10px;background:var(--navy);border-color:var(--navy);color:#fff;white-space:nowrap}
.cbtn.pri:hover{background:#25398A}
.cl.ok{color:var(--verde);font-weight:650}
.cl.ok .cl-t{color:#166534}
.cl.no .cl-t{color:#9AA1AE}
.cl.zz .cl-t{color:var(--mut)}
.lnk{color:var(--blu);font-weight:700;font-size:12px}
.perche{flex:1;min-width:0;height:26px;border:1px solid var(--blu);border-radius:6px;padding:0 8px;outline:0;font-size:12px}

/* scheda di lato */
.drawer{width:460px;flex:none;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line2);border-bottom:0;border-radius:12px 12px 0 0;overflow:hidden}
.drawer.wide{width:560px}
.dw-h{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dw-hl{flex:1;min-width:0}
.kick{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blu)}
.dw-h h2{margin:3px 0 2px;font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-.015em}
.dw-sub{font-size:12.5px;color:var(--mut)}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#6B7280;flex:none}
.x:hover{background:#F2F0EB}
.dw-b{flex:1;overflow:auto;padding:4px 18px 18px}
.props{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin:0 -18px;padding:6px 18px 10px;gap:2px 16px}
.pr{display:flex;flex-direction:column;gap:3px;padding:6px 0}
.pr>span{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.pv{display:flex;align-items:center;min-height:28px;text-align:left;border-radius:6px}
button.pv{padding:0 4px;margin-left:-4px}
button.pv:hover{background:#F4F7FC}
.pv-in{height:28px;border:1px solid transparent;border-radius:6px;padding:0 6px;margin-left:-6px;font-weight:700;width:120px;outline:0;background:none}
.pv-in:hover{border-color:var(--line2)} .pv-in:focus{border-color:var(--blu);background:#fff}
.callbox{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:10px 12px;border-radius:10px;background:#FFF8E1;border:1px solid #F6DE8D;color:#5C4300}
.callbox b{display:block;font-size:13px;color:#3D2C00}
.callbox span{font-size:12px}
.clbox{margin:12px 0 4px;padding:10px 12px;border-radius:10px;background:#F3F7FC;border:1px solid #DCE7F5}
.clbox .lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blu);margin-bottom:6px}
.clbox .cl-t{white-space:normal}
.dw-b section{padding:14px 0 2px}
.dw-b h3{margin:0 0 6px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#4B5563}
.dw-b p{margin:0;font-size:13.5px;line-height:1.55;color:#1F2937}
.mkt{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mkt div{padding:8px 10px;border-right:1px solid var(--line)}
.mkt div:last-child{border-right:0}
.mkt b{display:block;font-size:13.5px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkt span{font-size:10.5px;color:var(--mut);font-weight:600}
.scom{margin:0;padding:0;list-style:none;counter-reset:s}
.scom li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;padding:8px 10px;margin-bottom:6px;border-radius:8px;background:#FFFBEB;border-left:3px solid var(--ambra);font-size:13.5px;line-height:1.45}
.scom li::before{content:counter(s);font-weight:800;color:#946800}
.lista{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lista>div{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
.lista>div:last-child{border-bottom:0}
.lista .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{width:100%;min-height:72px;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;outline:0;resize:vertical;font-size:13px;line-height:1.5;background:#FDFCF9}
.note:focus{border-color:var(--blu);background:#fff}
.dw-f{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#FDFCF9;flex-wrap:wrap}
.dw-f .sp{flex:1}
.dw-f .info{font-size:12px;color:var(--mut);flex:1;min-width:0}
.perchebox{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:#FFF8E1;border:1px solid #F6DE8D;font-size:13px;color:#4A3600}
.filo{display:flex;flex-direction:column;gap:10px;padding:14px 0 4px}
.msg{max-width:86%}
.msg .mb{padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap}
.msg.loro .mb{background:#F2F0EB;border-top-left-radius:4px}
.msg.noi{align-self:flex-end}
.msg.noi .mb{background:#E8F0FB;border-top-right-radius:4px}
.msg .mt{font-size:10.5px;color:var(--mut);margin-top:3px;padding:0 4px}
.msg.noi .mt{text-align:right}
.bz{margin-top:14px;border:1px solid #CFE0F5;border-radius:12px;overflow:hidden}
.bz-h{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#F3F7FC;font-size:12px;font-weight:700;color:var(--navy);border-bottom:1px solid #DCE7F5}
.bz-h span{margin-left:auto;font-weight:500;color:var(--mut)}
.bz textarea{display:block;width:100%;min-height:230px;border:0;outline:0;padding:12px 14px;font-size:13.5px;line-height:1.6;resize:vertical;background:#fff}
.decidi{margin-top:14px;padding:12px;border:1px dashed var(--line2);border-radius:12px;display:flex;flex-direction:column;gap:8px}
.decidi p{font-size:13px}
.pin{flex:1;min-width:160px;height:34px;border:1px solid var(--blu);border-radius:9px;padding:0 10px;outline:0}

/* Clara in basso */
.clara{position:relative;display:flex;flex-direction:column;padding:8px 20px;flex:none;background:var(--avorio);border-top:1px solid var(--line2)}
.cbar{display:flex;align-items:center;gap:10px;height:42px;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:0 6px 0 7px}
.cbar:focus-within{border-color:var(--blu);box-shadow:0 0 0 3px rgba(41,121,196,.14)}
.cav{width:28px;height:28px;border-radius:50%;background:var(--blu);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;position:relative}
.cav.s{width:22px;height:22px;font-size:10px}
.cav .dotn{position:absolute;right:-1px;top:-1px;width:9px;height:9px;border-radius:50%;background:var(--ambra);border:2px solid #fff}
.cbar input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:13.5px;height:100%}
.cbar input::placeholder{color:#9AA1AE}
.csend{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--navy);color:#fff;flex:none}
.cbar .hint{font-size:11px;color:#A3A9B5;white-space:nowrap}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 8px}
.sugg button{height:28px;padding:0 11px;border-radius:999px;border:1px solid #D5E3F5;background:#F3F7FC;color:var(--navy);font-size:12px;font-weight:650}
.sugg button:hover{background:#E6EFFA}
.bolla{position:absolute;left:20px;bottom:calc(100% + 8px);width:min(500px,calc(100% - 40px));z-index:30}
.bl{background:#fff;border:1px solid var(--line2);border-radius:16px 16px 16px 4px;box-shadow:0 10px 30px rgba(20,30,60,.13);padding:10px 12px 12px}
.bl-h{display:flex;align-items:center;gap:8px;font-size:12px}
.bl-h b{color:var(--navy)}
.bl-h .x{width:26px;height:26px;margin-left:auto}
.bl-t{margin-top:6px;font-size:13.5px;line-height:1.5;color:#1F2937}
.bl-a{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.storia{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-top:8px}

<body>
<div id="app">
  <div id="banner"></div>
  <header class="top">

      <button type="button" id="cav" class="cav" aria-label="Conversazione con Clara">C</button>
      <input id="cmd" placeholder="Scrivi a Clara: «sposta Riva a tecnica giovedì»" aria-label="Scrivi a Clara">
      <span class="hint"><kbd>/</kbd> per scrivere</span>
      <button class="csend" aria-label="Manda a Clara"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8h10M8.5 3.5L13 8l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>

</div>

<script src="dati.js"></script>
<script>
(function () {
'use strict';
const L = window.LAB;
const KEY = 'lab-v4-foglio';
const OGGI = new Date(L.oggi + 'T09:00:00');
const GIORNI = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];

const TAPPE = [
  ['risposta', 'Risposta', '#94A3B8'], ['analisi', 'Analisi', '#60A5FA'], ['follow_up', 'Follow-up', '#2979C4'],
  ['conoscitiva', 'Conoscitiva', '#4F46E5'], ['tecnica', 'Tecnica', '#1C2E6E'], ['avvio', 'Avvio', '#0F766E'],
  ['prova', 'Prova', '#0D9488'], ['cliente', 'Cliente', '#15803D'],
];
const TAPPA = {}; TAPPE.forEach(([k, l, c], i) => { TAPPA[k] = { k, l, c, i }; });
const SEM = { ambra: ['#F5B200', '#2A1F00'], rosso: ['#DC2626', '#fff'], blu: ['#2979C4', '#fff'], verde: ['#15803D', '#fff'], grigio: ['#E8E4DB', '#4B5563'] };
const RANGO = { rosso: 0, ambra: 1, blu: 2, verde: 3, grigio: 4 };
const STATI_TASK = [['da accettare', 'Da accettare', 'ambra'], ['da fare', 'Da fare', 'ambra'], ['in corso', 'In corso', 'blu'], ['in ritardo', 'In ritardo', 'rosso'], ['fatto', 'Fatto', 'verde']];
const FIT = [['SI', 'Sì', '#15803D'], ['FORSE', 'Forse', '#B45309'], ['NO', 'No', '#9CA3AF']];
const PERS = {}; L.squadra.forEach(p => { PERS[p.id] = p; });
PERS.clara = { id: 'clara', nome: 'Clara', ruolo: 'Assistente', colore: '#2979C4' };
const VISTE = [['oggi', 'Oggi'], ['posta', 'Posta'], ['trattativa', 'Trattativa'], ['clienti', 'Clienti'], ['task', 'Task']];

const ic = {
  check: '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x: '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  spark: '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5c.5 3.2 1.8 4.6 5 5.2v.6c-3.2.6-4.5 2-5 5.2h-.5c-.5-3.2-1.8-4.6-5-5.2v-.6c3.2-.6 4.5-2 5-5.2z" fill="currentColor"/></svg>',
  chev: '<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  up: '<svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M4 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  down: '<svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M4 9l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  filt: '<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11l-4.2 5v4l-2.6 1.2V8.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  cal: '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 8.5h14M7 2.8v3M13 2.8v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  arrow: '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8h10M8.5 3.5L13 8l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  t_oggi: '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  t_posta: '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  t_trattativa: '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M4 12h13M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="17" cy="6" r="2" fill="currentColor"/></svg>',
  t_clienti: '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 12.5h18" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
  t_task: '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 12.5l2.7 2.7L16.5 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};

// ---------- stato salvato ----------
function iniziale() {
  const D = JSON.parse(JSON.stringify(L));
  D.aziende.forEach(a => { a.chi = { avvio: 'carlo', prova: 'carlo', cliente: 'salvatore' }[a.tappa] || 'dre'; a.note = ''; });
  const primo = {
    a3: { quando: '12/9', testo: 'Buongiorno Paolo, le lascio l’analisi su come Serramenti Vetta appare su Google. Se le va, ne parliamo in una chiamata di venti minuti.' },
    a6: { quando: '22/7', testo: 'Buongiorno Sara, ecco l’analisi su Pasticceria Dolce Vita che le avevo promesso. Quando rientra dalle ferie ne parliamo volentieri.' },
  };
  const posta = [];
  D.conversazioni.forEach(c => posta.push({ id: c.id, tipo: c.bozza ? 'Risposta' : 'Da decidere', azienda: c.azienda, aspetta: c.aspetta, perche: c.perche, filo: c.filo, bozza: c.bozza, stato: 'da approvare' }));
  D.seguiti.forEach(s => posta.push({ id: s.id, tipo: 'Follow-up', azienda: s.azienda, aspetta: 'pronto oggi', perche: s.perche, giorno: s.giorno, filo: [Object.assign({ chi: 'noi' }, primo[s.azienda])], bozza: s.bozza, stato: 'da approvare' }));
  posta.push({ id: 'p9', tipo: 'Analisi', azienda: 'a4', aspetta: 'partita il 4/10', perche: 'Ha detto sì il 3/10: analisi e proposta di call partite da sole', filo: [
    { chi: 'loro', quando: '3/10', testo: 'Sì, mi interessa: mandatemi pure l’analisi.' },
    { chi: 'noi', quando: '4/10', testo: 'Buongiorno Anna, ecco l’analisi su Agriturismo Colle Verde. Le propongo una chiamata di venti minuti: dal calendario sceglie lei il momento.' }], bozza: null, stato: 'corre' });
  return { v: 3, vista: 'oggi', come: 'dre', aziende: D.aziende, task: D.task, posta, call: D.call, clara: {}, log: [], banner: true, sort: {}, filtri: {} };
}
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || S.v !== 3) S = iniziale();

const U = { cur: null, edit: null, sel: new Set(), drawer: null, pop: null, undo: [], chat: [], bolla: null, storia: false, cerca: '', mobile: false, saved: null, props: {}, chiedi: null, scarta: false };
let NAV = [], COLS = [], F = null;

// ---------- piccoli aiuti ----------
const $ = s => document.querySelector(s);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const az = id => S.aziende.find(a => a.id === id);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const nome = id => PERS[id] ? PERS[id].nome : id;
const ad = id => (/^[aeiou]/i.test(nome(id)) ? 'ad ' : 'a ') + nome(id);
function gg(d) { return Math.round((OGGI - new Date(d + 'T09:00:00')) / 864e5); }
function quandoBreve(d) { const n = gg(d); if (n <= 0) return 'oggi'; if (n === 1) return 'ieri'; const x = new Date(d + 'T09:00:00'); return x.getDate() + '/' + (x.getMonth() + 1); }
function mille(n) { return String(Math.round(Number(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function euro(n) { return n ? mille(n) + ' €' : ''; }
function ora() { const d = new Date(); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, ' ').replace(/[«»"?!,]/g, ' ').replace(/\s+/g, ' ').trim(); }
function salva() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* niente */ } U.saved = ora(); }
function log(testo, azienda, per, chi) { S.log.unshift({ id: 'l' + Date.now() + Math.random().toString(36).slice(2, 5), ora: ora(), chi: chi || S.come, testo, azienda: azienda || null, per: per || [] }); }

// ---------- pezzi visivi ----------
function pill(st) { const c = SEM[st[0]] || SEM.grigio; return `<span class="pill" style="background:${c[0]};color:${c[1]}">${h(st[1])}</span>`; }
function chipC(l, c) { return `<span class="chip" style="--c:${c};--cb:${c}55"><i></i>${h(l)}</span>`; }
function chip(t) { return t ? chipC(t.l, t.c) : ''; }
function pers(id) { const p = PERS[id]; if (!p) return id === 'loro' ? '<span class="mut">loro</span>' : ''; return `<span class="pers"><span class="av" style="--c:${p.colore}">${h(p.nome[0])}</span>${h(p.nome)}</span>`; }
function fitChip(v) { const f = FIT.find(x => x[0] === v) || FIT[2]; return chipC(f[1], f[2]); }
const caret = `<span class="caret">${ic.chev}</span>`;

// ---------- lo stato di un'azienda, visto da chi guarda ----------
function chiDeve(a) {
  if (S.posta.some(p => p.azienda === a.id && (p.stato === 'da approvare' || p.stato === 'approvata'))) return 'dre';
  const t = S.task.find(t => t.azienda === a.id && t.stato !== 'fatto' && t.stato !== 'in corso');
  if (t) return t.a;
  const c = S.call.find(c => c.azienda === a.id && c.quando.startsWith('oggi'));
  if (c) return c.chi[0];
  if (a.palla === 'noi') return a.chi;
  if (a.palla === 'loro') return 'loro';
  return a.palla;
}
function statoAz(a) {
  const rit = S.task.find(t => t.azienda === a.id && t.stato === 'in ritardo');
  if (rit) return ['rosso', rit.a === S.come ? 'In ritardo, tua' : 'In ritardo: ' + nome(rit.a)];
  const w = chiDeve(a), n = gg(a.ultima);
  const p = S.posta.find(p => p.azienda === a.id && p.stato === 'da approvare');
  const m = p && /(\d+) giorn/.exec(p.aspetta);
  if (m) return ['rosso', (w === S.come ? 'Aspetta te' : 'Aspetta ' + nome(w)) + ' da ' + m[1] + ' g'];

const STOP = new Set(['studio', 'impianti', 'nord', 'della', 'delle', 'costruzioni', 'dentistico']);
function trovaAz(t) {
  let best = null, bs = 0;
  for (const a of S.aziende) {
    let s = 0;
    norm(a.nome).split(' ').filter(w => w.length >= 3 && !STOP.has(w)).forEach(w => { if (new RegExp('\\b' + w + '\\b').test(t)) s += 2; });
    norm(a.persona).split(' ').forEach(w => { if (w.length >= 4 && new RegExp('\\b' + w + '\\b').test(t)) s += 1; });
    if (s > bs) { bs = s; best = a; }
  }

    const ed = { kind: 'enum', vis: 'pers', val: S.come, opz: OPZ_PERS(), desc: 'Vedi il Workspace come' };
    selettore(x, ed, v => setCome(v)); return;
  }
  // menu colonna
  if (U.pop && U.pop.tipo === 'menu' && (x = t.closest('[data-m]'))) {
    const k = U.pop.k, m = x.dataset.m;
    if (m === 'asc' || m === 'desc') S.sort[S.vista] = { k, dir: m === 'asc' ? 1 : -1 };
    if (m === 'clear') { const fl = Object.assign({}, S.filtri[S.vista]); delete fl[k]; S.filtri[S.vista] = fl; }
    chiudiPop(); salva(); render(); return;
  }
  if (U.pop && U.pop.tipo === 'menu' && (x = t.closest('[data-mv]'))) {
    const k = U.pop.k; const vals = [...document.querySelectorAll('#pop [data-mv]')].filter(i => i.checked).map(i => i.dataset.mv);
    const all = document.querySelectorAll('#pop [data-mv]').length;
    const fl = Object.assign({}, S.filtri[S.vista]);
    if (vals.length === all) delete fl[k]; else fl[k] = { vals };
    S.filtri[S.vista] = fl; salva(); const keep = U.pop; render(); U.pop = keep; return;
  }
  if ((x = t.closest('[data-opt]'))) { scegli(+x.dataset.opt); return; }
  // bolla di Clara
  if (t.closest('[data-bx]')) { U.bolla = null; U.storia = false; renderBolla(); return; }
  if ((x = t.closest('[data-ba]'))) { const m = U.chat[U.bolla]; const a = m && m.azioni && m.azioni[+x.dataset.ba]; U.bolla = null; renderBolla(); if (a) a.f(); return; }
  if (t.closest('#cav')) { U.storia = !U.storia; renderBolla(); return; }
  if ((x = t.closest('#sugg button'))) { $('#cmd').value = ''; $('#sugg').hidden = true; capisci(x.textContent); return; }
  // intestazioni
  if ((x = t.closest('[data-sort]'))) { const k = x.dataset.sort; const so = S.sort[S.vista]; S.sort[S.vista] = so && so.k === k ? (so.dir > 0 ? { k, dir: -1 } : null) : { k, dir: 1 }; if (!S.sort[S.vista]) delete S.sort[S.vista]; salva(); render(); return; }
  if ((x = t.closest('[data-menu]'))) { menuColonna(x.dataset.menu, x); return; }
  if ((x = t.closest('[data-fx]'))) { const k = x.dataset.fx; if (k === '_cerca') { U.cerca = ''; $('#cerca').value = ''; } else if (k === '_tutti') { S.filtri[S.vista] = {}; U.cerca = ''; $('#cerca').value = ''; } else { const fl = Object.assign({}, S.filtri[S.vista]); delete fl[k]; S.filtri[S.vista] = fl; } salva(); render(); return; }
  if ((x = t.closest('[data-ftappa]'))) { const tp = x.dataset.ftappa; const cur = (S.filtri.trattativa || {}).tappa; const fl = Object.assign({}, S.filtri.trattativa); if (cur && cur.vals.length === 1 && cur.vals[0] === tp) delete fl.tappa; else fl.tappa = { vals: [tp] }; S.filtri.trattativa = fl; salva(); render(); return; }
  if (t.closest('[data-adesso]')) {
    if (S.vista === 'posta') { const nx = prossima(null); if (nx) apriPosta(nx.id); return; }
    const te = righeOggi().filter(r => r.gruppo === 'te'); const r = te[0];
    if (r) { if (r.prop && ['leggi', 'scheda', 'manda', 'accetta'].includes(r.prop.tipo)) siClara(r.prop); else if (r.apri) r.apri(); }
    return;
  }
  // selezione righe
  if ((x = t.closest('[data-tutte]'))) { const all = NAV.every(r => U.sel.has(r.id)); NAV.forEach(r => all ? U.sel.delete(r.id) : U.sel.add(r.id)); render(); return; }
  if ((x = t.closest('[data-riga]'))) { const r = NAV[+x.dataset.riga]; if (e.shiftKey && U.ultimaSel != null) { const a = Math.min(U.ultimaSel, +x.dataset.riga), b = Math.max(U.ultimaSel, +x.dataset.riga); for (let i = a; i <= b; i++) U.sel.add(NAV[i].id); render(); } else toggleSel(r.id, x.checked); U.ultimaSel = +x.dataset.riga; return; }
  if ((x = t.closest('[data-bulk]'))) { bulk(x.dataset.bulk, x); return; }
  // Clara nella cella
  if ((x = t.closest('[data-si]'))) { e.stopPropagation(); siClara(U.props[x.dataset.si]); return; }
  if ((x = t.closest('[data-no]'))) { e.stopPropagation(); noClara(U.props[x.dataset.no]); return; }
  if ((x = t.closest('[data-ripristina]'))) { const id = x.dataset.ripristina; muta('Ripristinata', () => { delete S.clara[id]; }); return; }
  // azioni
  if ((x = t.closest('[data-passa]'))) { passaACarlo(x.dataset.passa); return; }
  if ((x = t.closest('[data-apri]'))) { apriAz(x.dataset.apri); return; }
  if ((x = t.closest('[data-apripost]'))) { apriPosta(x.dataset.apripost); return; }
  if (t.closest('[data-chiudi]')) { chiudiDrawer(); return; }
  if ((x = t.closest('[data-approva]'))) { approva(x.dataset.approva); return; }
  if (t.closest('[data-scarta]')) { U.scarta = true; renderDrawer(); const i = $('#perchescarto'); if (i) i.focus(); return; }
  if (t.closest('[data-annscarta]')) { U.scarta = false; renderDrawer(); return; }
  if ((x = t.closest('[data-scartaok]'))) { scarta(x.dataset.scartaok, ($('#perchescarto') || {}).value || ''); return; }
  if ((x = t.closest('[data-copia]'))) { const p = S.posta.find(q => q.id === x.dataset.copia); copia(p.bozza); toast('Copiata di nuovo'); return; }
  if ((x = t.closest('[data-manda]'))) { const id = x.dataset.manda; mandata(id); U.drawer = null; renderDrawer(); return; }
  if ((x = t.closest('[data-chiamo]'))) {
    const p = S.posta.find(q => q.id === x.dataset.chiamo), a = az(p.azienda); const nx = prossima(p.id);
    muta('Segnato: lo chiami tu', () => { p.stato = 'gestita'; a.palla = 'noi'; S.task.unshift({ id: 't' + Date.now(), titolo: 'Chiamare ' + a.persona + ' al 347 000 0000', da: 'clara', a: 'dre', azienda: a.id, scadenza: 'oggi', stato: 'da fare' }); log('Edilnova: lo chiami tu oggi', a.id); });
    U.drawer = nx ? { tipo: 'posta', id: nx.id } : null; render();
    dici('Te l’ho messa in Oggi: chiamare ' + a.persona + ', numero nella task. Dopo la telefonata dimmi com’è andata e sposto la tappa.');
    return;
  }
  if ((x = t.closest('[data-scrivi]'))) {
    const p = S.posta.find(q => q.id === x.dataset.scrivi), a = az(p.azienda);
    muta('Bozza pronta', () => { p.tipo = 'Risposta'; p.bozza = 'Salve ' + a.persona.split(' ')[0] + ',\n\nvolentieri: la chiamo oggi pomeriggio al numero che mi ha lasciato.\nCosì ci conosciamo e capisco meglio cosa serve a ' + a.nome + '.\n\nA dopo'; }, { zitto: true });
    dici('Due righe pronte, nate dal suo «mi chiami». Leggile e approva.');
    return;
  }
  if ((x = t.closest('[data-dsel]'))) {
    const a = az(U.drawer.id), k = x.dataset.dsel;
    const ed = k === 'tappa' ? { kind: 'enum', vis: 'tappa', val: a.tappa, opz: OPZ_TAPPE(), set: v => { a.tappa = v; }, desc: 'Tappa' } : { kind: 'enum', vis: 'pers', val: a.chi, opz: OPZ_PERS(), set: v => { a.chi = v; }, desc: 'Chi segue' };
    selettore(x, ed); return;
  }
  // carte (telefono)
  if ((x = t.closest('[data-edc]'))) { const [i, c] = x.dataset.edc.split(':').map(Number); const ed = COLS[c].ed(NAV[i]); selettore(x, ed); return; }
  if ((x = t.closest('[data-card]'))) { if (t.closest('button,input,a')) return; const r = NAV[+x.dataset.card]; if (r && r.apri) r.apri(); return; }
  // celle
  if ((x = t.closest('#grid td.c'))) {
    const i = +x.dataset.i, c = +x.dataset.c, r = NAV[i], col = COLS[c];
    if (t.closest('input')) return;
    const gia = U.cur && U.cur.id === r.id && U.cur.k === col.k;
    U.cur = { id: r.id, k: col.k }; aggiornaAct(false); focusGrid();
    const ed = col.ed && col.ed(r);
    if (ed && (ed.kind === 'enum' || gia)) modifica(i, c);
    return;
  }
});
document.addEventListener('dblclick', e => {
  const x = e.target.closest('#grid td.c'); if (!x) return;
  const i = +x.dataset.i, c = +x.dataset.c; const col = COLS[c], r = NAV[i];
  if (!(col.ed && col.ed(r)) && r.apri && !e.target.closest('button')) r.apri();
});
function bulk(k, anchor) {
  const sel = NAV.filter(r => U.sel.has(r.id));
  if (k === 'via') { U.sel.clear(); render(); return; }
  if (k === 'prima') { const nx = prossima(null); if (nx) apriPosta(nx.id); return; }
  if (k === 'csv') return scarica(sel);
  if (k === 'fatte') { const tk = sel.filter(r => r.task && r.task.stato !== 'fatto'); muta(tk.length + ' task segnate fatte', () => tk.forEach(r => statoTask(r.task, 'fatto'))); U.sel.clear(); render(); return; }
  if (k === 'assegna') { const tk = sel.filter(r => r.task); selettore(anchor, { kind: 'enum', vis: 'pers', val: null, opz: OPZ_PERS(), desc: 'Passa ' + tk.length + ' task a' }, v => { muta(tk.length + ' task passate ' + ad(v), () => tk.forEach(r => riassegna(r.task, v))); U.sel.clear(); render(); }); return; }
  if (k === 'chi') { selettore(anchor, { kind: 'enum', vis: 'pers', val: null, opz: OPZ_PERS(), desc: 'Chi segue ' + sel.length + ' aziende' }, v => { muta(sel.length + ' aziende ' + ad(v), () => sel.forEach(r => { r.az.chi = v; })); }); return; }
  if (k === 'tappa') { selettore(anchor, { kind: 'enum', vis: 'tappa', val: null, opz: OPZ_TAPPE(), desc: 'Tappa di ' + sel.length + ' aziende' }, v => { muta(sel.length + ' aziende in ' + TAPPA[v].l, () => sel.forEach(r => { r.az.tappa = v; })); }); return; }
}
function scarica(sel) {
  const rows = sel.length ? sel : NAV, cols = COLS.filter(c => c.k !== 'passa');
  const campo = v => '"' + String(v == null ? '' : v).replace(/"/g, '""').replace(/\r?\n/g, ' ') + '"';
  const testo = '﻿' + [cols.map(c => campo(c.t)).join(';'), ...rows.map(r => cols.map(c => campo(c.lab ? c.lab(c.get(r)) : c.get(r))).join(';'))].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([testo], { type: 'text/csv;charset=utf-8' }));
  a.download = 'studio-galilei-' + S.vista + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(rows.length + ' righe scaricate per Excel');
}

// ---------- campi che salvano da soli ----------
let tNota = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'cerca') { U.cerca = t.value; U.cur = null; const f = foglio(); F = f; COLS = f.cols; renderSheet(visibili(f)); renderChips(); renderStatus(); return; }
  if (t.dataset.nota) { const a = az(t.dataset.nota); a.note = t.value; clearTimeout(tNota); tNota = setTimeout(() => { salva(); renderStatus(); }, 400); return; }
  if (t.dataset.bozza) { const p = S.posta.find(x => x.id === t.dataset.bozza); p.bozza = t.value; clearTimeout(tNota); tNota = setTimeout(() => { salva(); renderStatus(); }, 400); return; }
  if (t.id === 'cmd') { $('#sugg').hidden = !!t.value; return; }
  if (t.dataset.mt !== undefined && U.pop) { /* si applica con Invio */ }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.dnum) { const a = az(t.dataset.dnum); const v = parseInt(t.value.replace(/[^\d]/g, ''), 10) || 0; if (v !== (a.valore || 0)) muta(a.nome + ': ' + (euro(v) || 'vuoto') + ' al mese', () => { a.valore = v; }); }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && t.dataset.perche) { e.preventDefault(); e.stopPropagation(); const id = t.dataset.perche; const v = t.value.trim(); U.chiedi = null; muta('Motivo salvato', () => { S.clara[id].perche = v || 'senza motivo'; }, { zitto: true }); if (v) dici('Segnato: «' + v + '». Ne tengo conto.'); focusGrid(); }
  if (e.key === 'Enter' && t.dataset && t.dataset.mt !== undefined && U.pop) { e.preventDefault(); const k = U.pop.k, v = t.value.trim(); const fl = Object.assign({}, S.filtri[S.vista]); if (v) fl[k] = { txt: v }; else delete fl[k]; S.filtri[S.vista] = fl; chiudiPop(); salva(); render(); }
  if (e.key === 'Enter' && (t.id === 'nuova' || t.id === 'nuovaM')) { e.preventDefault(); const v = t.value.trim(); if (!v) return; muta('Task aggiunta', () => { S.task.unshift({ id: 't' + Date.now(), titolo: v, da: S.come, a: S.come, azienda: null, scadenza: 'oggi', stato: 'da fare' }); }); dici('Aggiunta e tua. Per passarla: clic sulla colonna «A» e scegli la persona.'); const n = $('#' + t.id); if (n) n.focus(); }
  if (e.key === 'Enter' && t.id === 'perchescarto') { e.preventDefault(); scarta(U.drawer.id, t.value.trim()); }
  if (e.key === 'Enter' && t.id === 'popq' && U.pop) { e.preventDefault(); e.stopPropagation(); scegli(U.pop.hi); }
}, true);
document.addEventListener('input', e => { if (e.target.id === 'popq' && U.pop) { U.pop.q = e.target.value; U.pop.hi = 0; disegnaSel(); } });

// Clara: la riga di comando
$('#cform').addEventListener('submit', e => { e.preventDefault(); const i = $('#cmd'); const v = i.value.trim(); if (!v) return; i.value = ''; $('#sugg').hidden = true; capisci(v); });
$('#cmd').addEventListener('focus', () => { if (!$('#cmd').value) { $('#sugg').innerHTML = SUGG.map(s => `<button type="button">${h(s)}</button>`).join(''); $('#sugg').hidden = false; } });
$('#cmd').addEventListener('blur', () => { setTimeout(() => { if (document.activeElement !== $('#cmd')) $('#sugg').hidden = true; }, 150); });
$('#sugg').addEventListener('mousedown', e => e.preventDefault());

// toast
let tT = null;
function toast(msg, undo) {
  const el = $('#toast'); el.innerHTML = `<span>${h(msg)}</span>${undo ? '<button data-undo>Annulla</button>' : ''}`; el.hidden = false;
  clearTimeout(tT); tT = setTimeout(() => { el.hidden = true; }, 5000);
}
$('#toast').addEventListener('click', e => { if (e.target.closest('[data-undo]')) { $('#toast').hidden = true; annulla(); } });

mq.addEventListener('change', () => { chiudiPop(); render(); });
render();
saluta();
})();
</script>
